<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2ECEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krachtlogboek">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Krachtlogboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column, sticky header, fixed bottom tab bar, bottom sheets for pickers */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E3E6E1; --fg:#15181B; --muted:#5F666D; --line:#D5D9D3;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --pr:#A86A00; --pr-bg:#FCEFD3; --danger:#B3261E;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1E; --sunk:#202429; --fg:#ECEEF1; --muted:#949AA2; --line:#2A2F35;
  --accent:#7290FF; --accent-ink:#0B0D10; --pr:#F2B544; --pr-bg:#3A2C10; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1E; --sunk:#202429; --fg:#ECEEF1; --muted:#949AA2; --line:#2A2F35;
  --accent:#7290FF; --accent-ink:#0B0D10; --pr:#F2B544; --pr-bg:#3A2C10; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2E9E5B}.dot.warn{background:var(--pr)}
h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-radius:4px;padding:2px 6px}
.empty{text-align:left;padding:18px}
.empty p{margin:0 0 12px}
.empty strong{font-family:var(--display);font-size:20px;display:block;margin-bottom:4px}
/* routine start cards */
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.start .name{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.start .go{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.06em;text-transform:uppercase;flex:none}
/* active workout */
.wohead{display:grid;gap:8px;margin-top:16px}
.wohead .title{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,.num{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;min-height:44px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.icons{display:flex;gap:2px;flex:none}
.ib{appearance:none;border:0;background:transparent;width:36px;height:36px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:17px;display:grid;place-items:center}
.ib:hover{background:var(--sunk)}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px;padding:0}
.refs div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.refs dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.refs dd{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.refs dd small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.refs .best{background:var(--pr-bg)}
.refs .best dd{color:var(--pr)}
.refs .target{grid-column:1/-1}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 44px 36px;gap:6px;align-items:center}
.sethead{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sethead span:nth-child(2),.sethead span:nth-child(3){padding-left:4px}
.setn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:44px;font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.num{text-align:center;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 4px}
.num::placeholder{color:var(--muted);opacity:.55}
.flag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--pr);text-align:center}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.addset{margin-top:8px}
.confirm{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:10px}
/* records */
.recgroup{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .b{font-family:var(--display);font-weight:700;font-size:19px;color:var(--pr);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .l{grid-column:1/-1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .b.none{color:var(--muted);font-weight:500;font-size:14px}
.routine .items{margin:6px 0 12px;color:var(--muted);font-size:14px}
.edititem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.edititem:first-of-type{border-top:0}
.edititem .tg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{display:grid;gap:8px}
.hist .h{background:var(--sunk);border-radius:8px;padding:10px 12px}
.hist .h .d{font-size:12px;color:var(--muted)}
.hist .h .s{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.pickitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 4px;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;min-height:48px}
.pickitem:first-child{border-top:0}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{appearance:none;border:0;background:transparent;padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:.04em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sheet .sh h2{margin:0;font-size:18px;letter-spacing:.02em;text-transform:none;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.who{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.who b{font-family:var(--display);font-size:16px;color:var(--fg)}
.linkbtn{appearance:none;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:6px 2px;min-height:32px}
.login{margin-top:28px;display:grid;gap:14px}
.login .q{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;text-wrap:balance;margin:0}
.choice{display:grid;gap:10px}
.choice .btn{min-height:56px;font-size:17px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.names .btn{min-height:60px;font-family:var(--display);font-size:20px;font-weight:700;text-align:left}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none}
.help{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.help .hn{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);line-height:1}
.help strong{font-family:var(--display);font-size:18px}
.help p,.hp{margin:4px 0 0;max-width:65ch}
.hp{margin:0}
.hl{margin:0;padding-left:18px;display:grid;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-transform:none;letter-spacing:0}
.segb,.chipb{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:8px 6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--fg)}
.segb[aria-pressed="true"],.chipb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;text-transform:none;letter-spacing:0}
.chipb{min-height:36px;padding:6px 12px;border-radius:18px;font-size:13px}
.hintline{font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
label.f i{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0}
textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;font-size:16px;font-family:var(--body);resize:vertical;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.sportrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:end}
.sportrow .sl{font-weight:600;padding-bottom:12px}
.wnow{display:grid;gap:2px}.wnow .big{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.spark{width:100%;height:70px;display:block}
.wlist{display:grid}.wrow{display:grid;grid-template-columns:1fr auto 36px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kcalcard{display:grid;gap:14px}
.kbig{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kbig span{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros .m,.tworow>div{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.ml{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.macros b,.tworow b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.ms{font-size:12px;color:var(--muted)}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.mp{background:var(--accent)}.mc{background:var(--pr)}.mf{background:var(--muted)}
.tworow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtable{display:grid}.mrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.mrow:first-child{border-top:0}
.calc{display:grid}.calc>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.calc>div:first-child{border-top:0}
.calc .tot{font-weight:700;border-top:2px solid var(--fg)}
.ex-meals{display:grid;gap:10px}.ex-meals>div{display:grid;gap:2px}.ex-meals span{color:var(--muted);font-size:14px}
.livespeed{background:var(--sunk);border-radius:8px;padding:10px 12px;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.card.plan{display:grid;gap:6px;border-left:4px solid var(--accent)}
.card.plan.late{border-left-color:var(--pr)}.card.plan.done{border-left-color:var(--line);opacity:.85}
.plan .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .pd{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.plan .pt{font-size:18px}
.pdesc{white-space:pre-wrap;margin:0;font-size:15px;line-height:1.45;background:var(--sunk);border-radius:8px;padding:8px 10px}
.pdone{font-weight:600;color:var(--ok,var(--accent))}
.qbanner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-top:12px}
.coachrow .ok{color:var(--fg);font-weight:600}.coachrow .miss{color:var(--pr);font-weight:600}
.adhead{display:flex;justify-content:space-between;align-items:center}
.arow{display:grid;gap:1px;padding:7px 0;border-top:1px solid var(--line)}.arow:first-child{border-top:0}
nav.tabs button{font-size:11px;padding:9px 2px 11px}
nav.tabs button svg{width:21px;height:21px}

:root{--sky1:#E2ECEC;--sky2:#ECEFE8;--sun:#F7E6C4;--m1:#D3DFDB;--m2:#C3D6CF;--m3:#B3CDC3;--trail:#EDE4D0;--water:#CFE2E3;--fig:#86A499;--glass:rgba(238,241,236,.82)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#0B1317;--sky2:#0E1215;--sun:#1B262A;--m1:#142026;--m2:#17262C;--m3:#1B2D33;--trail:#243036;--water:#152A31;--fig:#35505A;--glass:rgba(14,16,18,.82)}}
:root[data-theme="dark"]{--sky1:#0B1317;--sky2:#0E1215;--sun:#1B262A;--m1:#142026;--m2:#17262C;--m3:#1B2D33;--trail:#243036;--water:#152A31;--fig:#35505A;--glass:rgba(14,16,18,.82)}
body{background:transparent}
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--bg) 100%)}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:70vh;min-height:320px}
header.top,body::before{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.qbtn{appearance:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}
.folder{padding:0;overflow:hidden}
.fhead{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:10px;padding:14px;text-align:left;cursor:pointer;min-height:52px;color:var(--fg)}
.fhead .ficon{width:22px;height:22px;color:var(--accent);flex:none}.fhead .ficon svg{width:22px;height:22px}
.fhead .fname{font-family:var(--display);font-weight:700;font-size:19px;flex:1;line-height:1.15}
.fcount{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:1px 8px}
.chev{color:var(--muted);width:14px;text-align:center}
.fhead.plain{padding:6px 2px;min-height:40px}.fhead.plain .fname{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fbody{padding:0 14px 12px;border-top:1px solid var(--line)}
.fitem{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:6px}.fbody>.fitem:first-child{border-top:0}
.fi-n{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15}
.fi-x{color:var(--muted);font-size:13px}
.fitem .btnrow .btn{min-height:40px;padding:8px 10px}
.factions{display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:8px;border-top:1px solid var(--line)}
.linkbtn.danger{color:var(--danger)}
.libcard{display:flex;justify-content:space-between;align-items:center;gap:12px}.libcard>div{display:grid;gap:2px}.libcard strong{font-family:var(--display);font-size:18px;line-height:1.15}.libcard .btn{flex:none}
.codeinput{display:grid;grid-template-columns:1fr auto;gap:8px}
#sh-code{font-family:var(--display);font-size:20px;letter-spacing:.18em;text-transform:uppercase}
.sharecode{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.22em;text-align:center;background:var(--sunk);border-radius:10px;padding:14px 8px;user-select:all;font-variant-numeric:tabular-nums}
.seg4{grid-template-columns:repeat(4,1fr)}
.nf{grid-column:1/-1}
.weekbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:16px;padding:8px}
.weekbar .wk{text-align:center;display:grid}.weekbar .wk b{font-family:var(--display);font-size:20px}
.wkb{font-size:26px;width:44px;height:44px}
.weeksum{margin:10px 2px 4px;font-size:14px;color:var(--muted)}.weeksum b{color:var(--fg)}
.days{display:grid;gap:8px;margin-top:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px}
.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.day.past{opacity:.92}
.dh{display:flex;justify-content:space-between;align-items:center}
.dn{font-family:var(--display);font-weight:700;font-size:16px}
.day.today .dn{color:var(--accent)}
.dempty{margin:2px 0 0;font-size:13px;color:var(--muted)}
.prow{appearance:none;width:100%;text-align:left;border:0;background:var(--sunk);border-radius:8px;padding:8px 10px;margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;cursor:pointer;color:var(--fg)}

async function rpc(fn,args){
  const h={"Content-Type":"application/json","apikey":CFG.key};
  if(!CFG.key.startsWith("sb_publishable_"))h.Authorization="Bearer "+CFG.key;
  let r;
  try{r=await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)})}
  catch(e){const err=new Error("offline");err.code="net";throw err}
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}

function applyQueue(){for(const q of queue()){if(q.op==="put")S[q.col]={...S[q.col],[q.id]:q.data};else{const n={...S[q.col]};delete n[q.id];S[q.col]=n}}}
function saveCache(){if(!pid)return;const o={};COLLS.forEach(c=>o[c]=S[c]);lsSet(cacheKey(pid),o)}
function enqueue(op,col,id,data){const q=queue().filter(x=>!(x.col===col&&x.id===id));q.push({op,col,id,data:data??null});lsSet(qKey(pid),q)}
async function flushQueue(){
  if(flushing||!pid)return;
  const id=pid;let q=lsGet(qKey(id))||[];if(!q.length)return;
  flushing=true;let sent=0;
  try{
    while(q.length&&pid===id){
      const it=q[0];
      try{await rpc(it.op==="put"?"kl_put":"kl_del",it.op==="put"?{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id)),p_coll:it.col,p_id:it.id,p_data:it.data}:{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id)),p_coll:it.col,p_id:it.id})}
      catch(e){if(e.code==="bad_pin"||e.code==="bad_code")handleErr(e);break}
      sent++;
      q=(lsGet(qKey(id))||[]).filter(x=>!(x.col===it.col&&x.id===it.id&&JSON.stringify(x.data)===JSON.stringify(it.data)));lsSet(qKey(id),q);
    }
  }finally{flushing=false}
  if(pid===id){if(!q.length){S.mode="cloud";if(sent)toast("Je opgeslagen wijzigingen zijn verstuurd")}else S.mode="offline";render()}
}
async function put(col,id,data){
  S[col]={...S[col],[id]:data};saveCache();
  if(queue().length){enqueue("put",col,id,data);flushQueue();return false}
  try{await rpc("kl_put",{p_code:code,p_profile:pid,p_pin:myPin(),p_coll:col,p_id:id,p_data:data});S.mode="cloud";return true}
  catch(e){enqueue("put",col,id,data);if(e.code==="net"){S.mode="offline";render()}else handleErr(e);return false}
}
async function del(col,id){
  const n={...S[col]};delete n[id];S[col]=n;saveCache();
  if(queue().length){enqueue("del",col,id);flushQueue();return false}
  try{await rpc("kl_del",{p_code:code,p_profile:pid,p_pin:myPin(),p_coll:col,p_id:id});return true}
  catch(e){enqueue("del",col,id);if(e.code==="net"){S.mode="offline";render()}else handleErr(e);return false}

/* ---------- derived ---------- */
function sortedSessions(){return Object.entries(S.sessions).map(([id,s])=>({id,...s})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0))}
function exName(id,fallback){return S.exercises[id]?.name||fallback||"Onbekende oefening"}
function exGroup(id,fallback){return S.exercises[id]?.group||fallback||"Overig"}
function exKey(id){return norm(exName(id))}
function entryKey(e){return S.exercises[e.exId]?norm(S.exercises[e.exId].name):norm(e.name)}
function bestFor(exId){
  const k=exKey(exId);let best=null,date=null;
  for(const s of Object.values(S.sessions))for(const e of s.entries||[])if(entryKey(e)===k)for(const st of e.sets||[])if(st.r>0&&better(st,best)){best=st;date=s.date}
  return best?{set:best,date}:null;
}
function lastFor(exId){
  const k=exKey(exId);
  for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)return{sets:e.sets,date:s.date,name:s.routineName}}
  return null;
}
function historyFor(exId){const k=exKey(exId);const out=[];for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)out.push({date:s.date,name:s.routineName,sets:e.sets})}return out}

function saveDraft(){if(pid)lsSet(draftKey(),draft)}
function entryFor(exId,target){
  const last=lastFor(exId);
  const n=parseInt(target?.sets)||(last?last.sets.length:0)||3;
  return{exId,name:exName(exId),group:exGroup(exId),target:target&&(target.sets||target.reps||target.note)?{sets:target.sets||"",reps:target.reps||"",note:target.note||""}:null,sets:Array.from({length:n},()=>({k:"",r:""}))};
}
function startWorkout(routineId,plan){
  const r=routineId?S.routines[routineId]:null;
  draft={id:uid(),date:today(),planId:plan?.id||null,routineId:routineId||null,routineName:r?r.name:"Losse training",entries:r?(r.items||[]).filter(i=>S.exercises[i.exId]).map(i=>entryFor(i.exId,i)):[]};
  saveDraft();UI.confirm=null;render();window.scrollTo(0,0);
}
function placeholderFor(entry,j){const last=lastFor(entry.exId);if(!last)return null;return last.sets[j]||last.sets[last.sets.length-1]}
function rowIsPR(entry,st){const r=num(st.r);if(!r||r<=0)return false;const k=num(st.k)||0;const b=bestFor(entry.exId);return !b||better({k,r},b.set)}
async function finishWorkout(){
  const entries=draft.entries.map(e=>({exId:e.exId,name:exName(e.exId,e.name),group:exGroup(e.exId,e.group),sets:e.sets.map(s=>({k:num(s.k)||0,r:Math.round(num(s.r)||0)})).filter(s=>s.r>0)})).filter(e=>e.sets.length);
  if(!entries.length){toast("Vul minstens één set in met herhalingen.");return}
  let prs=0;for(const e of entries){let b=bestFor(e.exId)?.set||null;for(const s of e.sets)if(better(s,b)){prs++;b=s}}
  const id=draft.id||uid();
  const rec={date:draft.date||today(),ts:Date.now(),routineId:draft.routineId,routineName:draft.routineName,entries};
  if(draft.planId&&S.plan[draft.planId]){rec.planId=draft.planId;rec.planTitle=planTitle({id:draft.planId,...S.plan[draft.planId]})}
  draft=null;saveDraft();UI.confirm=null;
  const ok=await put("sessions",id,rec);
  if(!ok)toast("Geen internet: training bewaard op je telefoon. Wordt automatisch verstuurd zodra je verbinding hebt.");
  else toast(prs?`Training opgeslagen · ${prs} nieuw${prs>1?"e":""} record${prs>1?"s":""}`:"Training opgeslagen");
  render();window.scrollTo(0,0);
}

  const recent=sortedSessions().slice(0,6);
  if(recent.length){
    h+=`<h2>Recente trainingen</h2><div class="recgroup">`+recent.map(s=>{const nSets=(s.entries||[]).reduce((t,e)=>t+e.sets.length,0);
      if(s.kind==="cardio")return `<button class="row" data-act="open-session" data-id="${s.id}"><span class="n">${esc(s.sport)}${s.purpose?` <span class="chip">${esc(s.purpose)}</span>`:""}</span><span class="b none">${dateTxt(s.date)}</span><span class="l">${cardioSummary(s)}</span></button>`;

  }
  if(S.me&&S.me.isAdmin)h+=`<h2>Coachen</h2><button class="btn block" data-act="coach-open">Trainingen inplannen voor anderen</button>`;
  return h;
}

function viewRecords(){return viewStrengthRecords()+viewCardioRecords()}
function viewStrengthRecords(){
  const q=UI.recQ.trim().toLowerCase();
  const seen=new Set();
  const list=Object.entries(S.exercises).sort((a,b)=>a[1].name.localeCompare(b[1].name)).filter(([,x])=>{const k=norm(x.name);if(seen.has(k))return false;seen.add(k);return !q||x.name.toLowerCase().includes(q)});
  let h=`<h2>Hoogste resultaten</h2><input type="search" id="rec-q" placeholder="Zoek een oefening" value="${esc(UI.recQ)}" autocomplete="off">`;
  if(!Object.keys(S.exercises).length)return h+`<div class="card empty" style="margin-top:12px"><strong>Nog geen records</strong><p class="muted">Zodra je een training logt, verschijnt hier per spiergroep je zwaarste set: meeste kg, en bij gelijk gewicht de meeste reps.</p></div>`;
  if(!list.length)return h+`<p class="muted">Geen oefening gevonden voor "${esc(UI.recQ)}".</p>`;
  const groups=[...GROUPS,...new Set(list.map(([,x])=>x.group).filter(g=>!GROUPS.includes(g)))];
  for(const g of groups){
    const rows=list.filter(([,x])=>(x.group||"Overig")===g);
    if(!rows.length)continue;
    h+=`<h2>${esc(g)}</h2><div class="recgroup">`+rows.map(([id,x])=>{const b=bestFor(id),l=lastFor(id);
      return `<button class="row" data-act="open-ex" data-id="${id}"><span class="n">${esc(x.name)}</span>${b?`<span class="b">${setTxt(b.set)}</span>`:`<span class="b none">Nog niet gelogd</span>`}${l?`<span class="l">Laatste ${dateTxt(l.date)}: ${l.sets.map(shortSet).join(" · ")}${b?` · record ${dateTxt(b.date)}`:""}</span>`:""}</button>`}).join("")+`</div>`;
  }
  return h;
}

function bodyMeta(){const b={...(S.meta.body||{})};if(GOAL_OLD[b.goal])b.goal=GOAL_OLD[b.goal];if(b.work&&!WORK.some(w=>w[0]===b.work))b.work="gemengd";return b}

function fmt1(n){return (Math.round(n*10)/10).toString().replace(".",",")}
const nl=n=>Math.round(n).toLocaleString("nl-NL");

function sparkline(list){
  if(list.length<2)return "";
  const W=320,H=70,P=6,ks=list.map(x=>x.kg),mn=Math.min(...ks),mx=Math.max(...ks),rg=(mx-mn)||1;
  const pts=list.map((x,i)=>[P+i*(W-2*P)/(list.length-1),H-P-(x.kg-mn)/rg*(H-2*P)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverloop van ${fmt1(ks[0])} naar ${fmt1(ks[ks.length-1])} kg"><path d="${d} L${last[0]} ${H} L${pts[0][0]} ${H} Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}

function nutrition(){
  const b=bodyMeta(),w=currentWeight(),miss=[];
  if(!b.age)miss.push("leeftijd");if(!b.height)miss.push("lengte");if(!b.sex)miss.push("geslacht");if(!w)miss.push("gewicht");if(!b.goal)miss.push("doel");
  if(miss.length)return{miss};
  const bmr=10*w+6.25*b.height-5*b.age+(b.sex==="Man"?5:b.sex==="Vrouw"?-161:-78);
  const wk=WORK.find(x=>x[0]===b.work)||WORK[2],steps=b.steps>0?b.steps:null;
  let base,neatTxt;
  if(steps){const stepK=Math.max(0,steps-3000)*0.0006*w,workK=wk[3]*bmr;base=bmr*1.2+stepK+workK;neatTxt={steps,stepK,workK}}
  else{base=bmr*wk[2];neatTxt=null}
  let weekly=0,sessions=0,strMin=0,endMin=0,mixMin=0;
  for(const [k,,met,dm,type] of SPORTS){const s=(b.sports||{})[k];if(!s||!s.n)continue;const mins=s.min||dm;weekly+=s.n*(mins/60)*(met-1)*w;sessions+=s.n;
    if(type==="kracht")strMin+=s.n*mins;else if(type==="duur")endMin+=s.n*mins;else mixMin+=s.n*mins}
  const endH=(endMin+mixMin*0.5)/60,strH=strMin/60;
  const ptype=endH>=2&&endH>=2*strH?"duur":strH>0&&strH>=2*endH?"kracht":(endH||strH)?"gemengd":"rust";
  const tdee=base+weekly/7;
  const goal=b.goal;
  let adj=goal==="afvallen"?Math.max(-0.2*tdee,-750):goal==="droog_heavy"?-500:goal==="droog_lean"?-250:goal==="bulk_lean"?200:goal==="bulk_heavy"?400:0;
  let kcal=tdee+adj;const floor=Math.max(bmr*1.1,b.sex==="Vrouw"?1400:1600);let floored=false;
  if(kcal<floor){kcal=floor;floored=true}
  const adviceKcal=kcal;
  const nut=b.nut||{};let manualK=false,manualP=false;
  if(nut.kcal>=1000&&nut.kcal<=7000){kcal=nut.kcal;manualK=true}
  let pPerKg={afvallen:2.0,droog_heavy:2.3,droog_lean:2.1,onderhoud:1.7,bulk_lean:1.8,bulk_heavy:1.8}[goal]||1.8;
  if(ptype==="duur"&&!isCut(goal))pPerKg=1.6;
  const carbFloor=endH>=10?7:endH>=7?6:endH>=4?5:endH>=2?4:0;
  let protein=pPerKg*w,fat=Math.max(0.25*kcal/9,0.8*w),carbs=(kcal-protein*4-fat*9)/4,carbShort=false;
  if(carbFloor&&carbs<carbFloor*w){fat=Math.max(0.2*kcal/9,0.7*w);carbs=(kcal-protein*4-fat*9)/4;if(carbs<carbFloor*w-5)carbShort=true}
  carbs=Math.max(0,carbs);
  const pct=nut.pct;
  if(pct&&Math.abs(pct.p+pct.c+pct.f-100)<0.6){protein=kcal*pct.p/100/4;carbs=kcal*pct.c/100/4;fat=kcal*pct.f/100/9;manualP=true}
  const tDays=Math.min(7,sessions),ratio=kcal/tdee;
  const restKcal=base*ratio,trainKcal=tDays?(base+weekly/tDays)*ratio:null;
  const bmi=w/Math.pow(b.height/100,2),tBmi=b.targetWeight?b.targetWeight/Math.pow(b.height/100,2):null;
  let weeks=null;if(b.targetWeight){const diff=b.targetWeight-w,delta=kcal-tdee;if(Math.abs(diff)>=0.3&&Math.sign(diff)===Math.sign(delta)&&Math.abs(delta)>=100)weeks=Math.ceil(Math.abs(diff)*7700/Math.abs(delta)/7)}
  const warn=[];
  if(b.targetWeight){const diff=b.targetWeight-w;
    if(isBulk(goal)&&diff<-0.5)warn.push("Je doelgewicht ligt onder je huidige gewicht, maar je doel is een bulk. Kies afvallen of droogtrainen, of pas je doelgewicht aan.");
    if(isCut(goal)&&diff>0.5)warn.push("Je doelgewicht ligt boven je huidige gewicht, maar je doel is afvallen of droogtrainen. Kies een bulk of pas je doelgewicht aan.");}
  if(isCut(goal)&&bmi<18.5)warn.push("Je BMI ligt onder 18,5. Afvallen raden we dan niet aan. Overleg bij twijfel met een huisarts of diëtist.");
  if(tBmi&&tBmi<18.5)warn.push("Je doelgewicht geeft een BMI onder 18,5. Dat is ondergewicht; kies een hoger doel.");
  if(floored&&!manualK)warn.push("Het berekende tekort was te groot. Je dagdoel is afgerond naar een veilige ondergrens; reken dan op langzamer resultaat.");
  if(manualK&&kcal<floor)warn.push(`Je handmatige dagdoel ligt onder de veilige ondergrens van ± ${r10(floor)} kcal voor jou.`);
  if(carbShort&&!manualP)warn.push(`Met dit dagdoel haal je de ${carbFloor} g koolhydraten per kg niet die bij jouw hoeveelheid duursport past. Overweeg een kleiner tekort.`);
  return{bmr,base,wk,neatTxt,weekly,sessions,tdee,adj:kcal-tdee,adviceKcal,kcal,protein,pPerKg:protein/w,fat,carbs,restKcal,trainKcal,tDays,bmi,weeks,warn,w,b,ptype,endH,strH,carbFloor,manualK,manualP};
}

const DAYSNACKS=[[0,1],[2,3],[0,4]];
function pickFood(cands,p,used,rot){
  const ok=cands.filter(id=>FOOD[id]&&foodAllowed(FOOD[id],p)&&!used.has(id));
  if(!ok.length)return null;
  const liked=ok.filter(id=>p.likes.includes(id)),pool=liked.length?liked:ok;
  return pool[rot%pool.length];
}
function buildDay(di,n,p,seed){
  const items=[],used=new Set();
  for(const [m] of MEALS){
    const tpls=m==="snack"?DAYSNACKS[di].map(i=>TPL.snack[i]):[TPL[m][di]];
    tpls.forEach((tpl,ti)=>{
      tpl.forEach((slot,si)=>{
        let id=pickFood(slot,p,used,di+seed+si+ti);
        if(!id&&si<2){const cat=FOOD[slot[0]].cat;id=pickFood(FOODS.filter(f=>f.cat===cat||(["vlees","vis","vega"].includes(cat)&&["vlees","vis","vega"].includes(f.cat))).map(f=>f.id),p,used,di+seed)}
        if(id){used.add(id);items.push({meal:m,id,g:FOOD[id].por})}
      });
    });
  }
  optimize(items,n);
  const FILL=[["banaan","rijstwafel","ontbijtkoek","rozijnen"],["granola","muesli","noten_mix","pindakaas","brood_vk"],["melk_hv","sojamelk","skyr","yoghurt_mager"]];
  for(let k=0;k<3&&sumM(items).k<n.kcal*0.96;k++){
    const id=pickFood(FILL[(k+di)%FILL.length],p,used,di+seed+k);if(!id)continue;
    used.add(id);items.push({meal:"snack",id,g:FOOD[id].por});optimize(items,n);
  }
  return items;
}
function optimize(items,n){
  const T=[n.protein,n.carbs,n.fat],W=[3,1.5,1.5],lam=0.012;
  const A=items.map(it=>{const f=FOOD[it.id];return[f.p/100,f.c/100,f.f/100]});
  const M=()=>{const s=[0,0,0];items.forEach((it,i)=>{for(let k=0;k<3;k++)s[k]+=A[i][k]*it.g});return s};
  for(let sweep=0;sweep<60;sweep++){
    for(let i=0;i<items.length;i++){
      const f=FOOD[items[i].id],m=M(),r=m.map((v,k)=>v-T[k]);
      let num_=lam*(items[i].g-f.por)/(f.por*f.por),den=lam/(f.por*f.por);
      for(let k=0;k<3;k++){num_+=W[k]*A[i][k]*r[k]/(T[k]*T[k]);den+=W[k]*A[i][k]*A[i][k]/(T[k]*T[k])}
      items[i].g=Math.min(f.max,Math.max(f.min,items[i].g-num_/den));
    }
  }
  items.forEach(it=>{const f=FOOD[it.id];it.g=Math.min(f.max,Math.max(f.min,Math.round(it.g/f.st)*f.st))});
}
function macrosOf(it){const f=it.food||FOOD[it.id]||{k:0,p:0,c:0,f:0};const q=it.g/100;return{k:f.k*q,p:f.p*q,c:f.c*q,f:f.f*q}}
function sumM(list){return list.reduce((s,it)=>{const m=it.k!=null&&!it.id?it:macrosOf(it);s.k+=m.k;s.p+=m.p;s.c+=m.c;s.f+=m.f;return s},{k:0,p:0,c:0,f:0})}
function portionTxt(it){const f=FOOD[it.id];if(f.u){const n=Math.round(it.g/f.u*2)/2;const w={ei:"ei",banaan:"banaan",appel:"appel",sinaasappel:"sinaasappel",mandarijn:"mandarijn",kiwi:"kiwi",wrap:"wrap",eiwitreep:"reep",brood_vk:"snee",brood_wit:"snee",knackebrood:"cracker",rijstwafel:"rijstwafel",ontbijtkoek:"plak"}[f.id]||"stuk";return `${it.g} g · ${String(n).replace(".",",")} ${w}${n>1&&w==="snee"?"ën":n>1&&w==="ei"?"eren":""}`}return `${it.g} g`}
let dayCache=null;
function exampleDays(n){
  const p=prefs(),key=JSON.stringify([r10(n.kcal),r5(n.protein),r5(n.carbs),r5(n.fat),p,UI.daySeed||0]);
  if(dayCache&&dayCache.key===key)return dayCache.days;

}

function durTxt(min){if(!min)return"—";const t=Math.round(min*60),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
function paceTxt(min,km){if(!min||!km)return"—";const p=min/km;let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return `${m}:${String(s).padStart(2,"0")} /km`}

/* GPX: alleen tijd, afstand, hartslag en snelste afstanden worden bewaard, niet de route zelf */
function parseGpx(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("geen geldig GPX-bestand");
  const pts=[...doc.getElementsByTagName("trkpt")].map(p=>{
    const t=p.getElementsByTagName("time")[0];let hr=null;
    for(const el of p.getElementsByTagName("*"))if(/(^|:)hr$/i.test(el.nodeName)){hr=parseFloat(el.textContent);break}
    return{lat:parseFloat(p.getAttribute("lat")),lon:parseFloat(p.getAttribute("lon")),t:t?Date.parse(t.textContent):NaN,hr};
  }).filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&isFinite(p.t));
  if(pts.length<2)throw new Error("geen route met tijden gevonden");
  const R=6371000,rad=x=>x*Math.PI/180;
  const cum=[0];
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;cum.push(cum[i-1]+2*R*Math.asin(Math.sqrt(h)))}
  const totalM=cum[cum.length-1],secs=(pts[pts.length-1].t-pts[0].t)/1000;
  const typeEl=doc.getElementsByTagName("type")[0],type=typeEl?typeEl.textContent.toLowerCase():"";
  const sport=/cycl|bik|ride|fiets|^1$/.test(type)?"Wielrennen":/run|loop|^9$/.test(type)?"Hardlopen":null;
  const hrs=pts.map(p=>p.hr).filter(x=>x>30&&x<240);
  const avgHr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null,maxHr=hrs.length?Math.round(Math.max(...hrs)):null;
  const best=dm=>{let j=0,bestS=Infinity;for(let i=1;i<pts.length;i++){if(cum[i]<dm)continue;while(j+1<i&&cum[i]-cum[j+1]>=dm)j++;const over=(cum[i]-cum[j])-dm,seg=cum[j+1]-cum[j]||1;const tStart=pts[j].t+Math.min(1,over/seg)*(pts[j+1].t-pts[j].t);const s=(pts[i].t-tStart)/1000;if(s>0&&s<bestS)bestS=s}return isFinite(bestS)?Math.round(bestS):null};
  const d=new Date(pts[0].t);
  return{date:isoOf(d),secs,km:totalM/1000,sport,avgHr,maxHr,best,name:(doc.getElementsByTagName("name")[0]||{}).textContent||""};
}
async function importGpx(file){
  try{
    const g=parseGpx(await file.text()),c=UI.cardio;
    if(g.secs<=0||g.km<0.2)throw new Error("te korte activiteit");
    if(g.sport&&g.sport!==c.sport)c.sport=g.sport;
    const ds=c.sport==="Wielrennen"?BIKE_D:RUN_D,efforts={};
    for(const d of ds)if(g.km>=d){const s=g.best(d*1000);if(s)efforts[String(d)]=s}
    const t=Math.round(g.secs);
    Object.assign(c,{date:g.date,h:String(Math.floor(t/3600)||""),m:String(Math.floor(t%3600/60)),s:String(t%60),km:String(Math.round(g.km*100)/100).replace(".",","),avgHr:g.avgHr?String(g.avgHr):c.avgHr,maxHr:g.maxHr?String(g.maxHr):c.maxHr,efforts,gpx:`${file.name.slice(0,40)} · ${fmt1(g.km)} km`});
    saveCardioDraft();render();
    const n=Object.keys(efforts).length;toast(`GPX ingelezen: ${fmt1(g.km)} km in ${durTxt(g.secs/60)}${n?` · ${n} snelste afstand${n>1?"en":""} berekend`:""}`);
  }catch(e){toast("Dit bestand kon niet gelezen worden: "+(e.message||"onbekende fout")+". Gebruik een GPX-export van één activiteit.")}
}
function cardioSessions(sport){return sortedSessions().filter(s=>s.kind==="cardio"&&(!sport||s.sport===sport))}
function cardioSummary(s){return [s.km?fmt1(s.km)+" km":null,durTxt(s.durMin),s.km&&s.durMin&&isRunBike(s.sport)?(s.sport==="Hardlopen"?paceTxt(s.durMin,s.km):fmt1(speed(s.durMin,s.km))+" km/u"):null].filter(Boolean).join(" · ")}
function distRecords(sport){
  const ds=sport==="Wielrennen"?BIKE_D:RUN_D,list=cardioSessions(sport),out=[];
  for(const d of ds){
    let best=null;
    for(const s of list){
      let sec=null,est=false;
      if(s.efforts&&s.efforts[String(d)])sec=s.efforts[String(d)];
      else if(s.km&&s.durMin&&s.km>=d-0.05){sec=s.durMin*60/s.km*d;est=Math.abs(s.km-d)>0.05}
      if(sec&&(!best||sec<best.sec))best={sec,est,date:s.date,id:s.id};
    }
    if(best)out.push({d,...best});
  }
  return out;
}
function viewCardioRecords(){
  const all=cardioSessions();if(!all.length)return "";
  const month=today().slice(0,7);let h="";
  for(const sp of ["Hardlopen","Wielrennen"]){
    const l=cardioSessions(sp);if(!l.length)continue;
    const kmMonth=l.filter(s=>(s.date||"").startsWith(month)).reduce((t,s)=>t+(s.km||0),0);
    const recs=distRecords(sp);
    h+=`<h2>${sp}</h2><div class="recgroup"><div class="row" style="cursor:default"><span class="n">Deze maand</span><span class="b">${fmt1(kmMonth)} km</span><span class="l">${l.length} ${l.length===1?"training":"trainingen"} totaal · langste ${fmt1(Math.max(...l.map(s=>s.km||0)))} km</span></div>`+
      recs.map(r=>`<button class="row" data-act="open-session" data-id="${r.id}"><span class="n">${distLbl(r.d)}</span><span class="b">${r.est?"≈ ":""}${durTxt(r.sec/60)}</span><span class="l">${sp==="Hardlopen"?paceTxt(r.sec/60,r.d):fmt1(r.d/(r.sec/3600))+" km/u"} · ${dateTxt(r.date)}${r.est?" · o.b.v. gemiddeld tempo":""}</span></button>`).join("")+`</div>`;
  }
  if(cardioSessions("Hardlopen").length||cardioSessions("Wielrennen").length)h+=`<p class="small muted">≈ = berekend met het gemiddelde tempo van een langere training. Importeer een GPX-bestand voor je echte snelste tijd binnen een training.</p>`;
  const others={};for(const s of all)if(!isRunBike(s.sport))(others[s.sport]=others[s.sport]||[]).push(s);
  const names=Object.keys(others).sort();
  if(names.length){
    h+=`<h2>Overige sporten</h2><div class="recgroup">`+names.map(n=>{const l=others[n],mins=l.filter(s=>(s.date||"").startsWith(month)).reduce((t,s)=>t+(s.durMin||0),0);
      return `<div class="row" style="cursor:default"><span class="n">${esc(n)}</span><span class="b">${l.length}×</span><span class="l">${mins?`Deze maand ${Math.floor(mins/60)?Math.floor(mins/60)+" u ":""}${Math.round(mins%60)} min`:"Deze maand nog niet"} · laatst ${dateTxt(l[0].date)}</span></div>`}).join("")+`</div>`;
  }
  return h;
}

function queueBanner(){
  const n=queue().length;if(!n)return "";
  return `<div class="banner qbanner"><span>${n} wijziging${n>1?"en":""} nog niet verstuurd. Dat gebeurt automatisch zodra je internet hebt.</span><button class="linkbtn" data-act="flush">Nu versturen</button></div>`;

function dayLabel(iso){
  const t=today();if(iso===t)return "Vandaag";if(iso===addDays(t,1))return "Morgen";if(iso===addDays(t,-1))return "Gisteren";
  const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"});
}
function planTargets(p){return [p.purpose,p.durMin?`± ${String(p.durMin).replace(".",",")} min`:null,p.km?`${fmt1(p.km)} km`:null].filter(Boolean).map(esc).join(" · ")}
function planSession(sessions,planId){return Object.entries(sessions||{}).map(([id,s])=>({id,...s})).find(s=>s.planId===planId)||null}

function folderList(){return Object.entries(S.folders||{}).map(([id,f])=>({id,...f})).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(String(b.name)))}
function routinesIn(fid){return Object.entries(S.routines).filter(([,r])=>((r.folderId&&S.folders[r.folderId])?r.folderId:null)===fid).sort((a,b)=>(a[1].order??0)-(b[1].order??0)||a[1].name.localeCompare(b[1].name))}
async function runJobs(jobs,fn){for(let i=0;i<jobs.length;i+=8)await Promise.all(jobs.slice(i,i+8).map(j=>fn(...j)))}
function cleanItem(it){return{name:String(it&&it.name||"").trim().slice(0,80),group:GROUPS.includes(it&&it.group)?it.group:"Overig",sets:String(it&&it.sets||"").slice(0,10),reps:String(it&&it.reps||"").slice(0,20),note:String(it&&it.note||"").slice(0,200)}}
async function addFolderSet(pkg,fid){
  const exMap=new Map(Object.entries(S.exercises).map(([id,x])=>[norm(x.name),id]));
  const ex=[],rest=[];
  const resolve=it=>{const k=norm(it.name);if(exMap.has(k))return exMap.get(k);const id=uid();exMap.set(k,id);ex.push(["exercises",id,{name:it.name,group:it.group}]);return id};
  if(fid)rest.push(["folders",fid,{name:String(pkg.name||"Map").slice(0,60),order:folderList().length,lib:pkg.lib||null}]);
  const base=fid?0:routinesIn(null).length;
  (pkg.routines||[]).forEach((r,i)=>{
    const items=(r.items||[]).map(cleanItem).filter(it=>it.name);
    rest.push(["routines",uid()+i,{name:String(r.name||"Schema").slice(0,80),folderId:fid||null,order:base+i,items:items.map(it=>({exId:resolve(it),sets:it.sets,reps:it.reps,note:it.note}))}]);
  });
  await runJobs(ex,put);await runJobs(rest,put);
  if(fid){UI.open["f:"+fid]=true;lsSet(LS_OPEN,UI.open)}
  return fid;
}
async function addLibrary(libId,fid){const lib=LIB.find(l=>l.id===libId);if(!lib)return null;return addFolderSet({name:lib.name,lib:libId,routines:lib.routines},fid||("fd-"+libId+"-"+uid()))}
async function seedStandard(){
  if(seeding||!pid||S.mode!=="cloud"||queue().length||(S.meta.seed&&S.meta.seed.v>=5))return;
  seeding=true;const id=pid;
  try{
    if(S.meta.seed&&S.meta.seed.v===4){
      const ent=Object.entries(S.routines).find(([,r])=>r.folderId==="fd-kt3"&&r.name==="Legs/abs");
      if(ent){
        const [rid,r]=ent,lib=LIB[0].routines[2].items,have=new Set((r.items||[]).map(it=>norm(exName(it.exId)))),add=[];
        const exMap=new Map(Object.entries(S.exercises).map(([xid,x])=>[norm(x.name),xid]));
        for(const it of lib.slice(6))if(!have.has(norm(it.name))){let xid=exMap.get(norm(it.name));if(!xid){xid=uid();await put("exercises",xid,{name:it.name,group:it.group})}add.push({exId:xid,sets:"",reps:"",note:""})}
        if(add.length)await put("routines",rid,{...clone(r),items:[...(r.items||[]),...add]});
      }
      await put("meta","seed",{v:5,at:Date.now()});render();return;
    }
    await runJobs(OLD_TPL_ROUTINES.filter(r=>S.routines[r]).map(r=>["routines",r]),del);
    const used=new Set();
    for(const s of Object.values(S.sessions))for(const e of s.entries||[]){used.add(e.exId);used.add(norm(e.name))}
    for(const r of Object.values(S.routines))for(const it of r.items||[])used.add(it.exId);
    await runJobs(Object.keys(TEMPLATE.exercises).filter(x=>S.exercises[x]&&!used.has(x)&&!used.has(norm(S.exercises[x].name))).map(x=>["exercises",x]),del);
    if(pid!==id)return;
    if(!folderList().some(f=>f.lib==="kt3"))await addLibrary("kt3","fd-kt3");
    await put("meta","seed",{v:5,at:Date.now()});
    render();
  }finally{seeding=false}
}
function pkgRoutine(r){return{name:r.name,items:(r.items||[]).filter(it=>S.exercises[it.exId]).map(it=>({name:exName(it.exId),group:exGroup(it.exId),sets:it.sets||"",reps:it.reps||"",note:it.note||""}))}}
async function shareThing(kind,id){
  let pkg;
  if(kind==="folder"){const f=S.folders[id];if(!f)return;pkg={type:"folder",name:f.name,routines:routinesIn(id).map(([,r])=>pkgRoutine(r))}}
  else{const r=S.routines[id];if(!r)return;pkg={type:"routine",name:r.name,routines:[pkgRoutine(r)]}}
  if(!pkg.routines.some(r=>r.items.length)){toast("Er staan nog geen oefeningen in om te delen.");return}
  pkg.by=S.me?.name||"";pkg.v=1;
  try{const c=await rpc("kl_share_create",{p_code:code,p_profile:pid,p_pin:myPin(),p_data:pkg});UI.sheet={type:"share",code:c,name:pkg.name,kind};UI.confirm=null;render()}
  catch(e){if(e.code==="net")toast("Delen lukt alleen met internet.");else if(e.code==="too_big")toast("Dit is te groot om te delen. Deel de schema's los.");else handleErr(e)}
}

async function lookupShare(c){
  c=String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==6){toast("Een deelcode heeft 6 tekens, bijvoorbeeld 7KQ2MX.");return}
  try{const d=await rpc("kl_share_get",{p_code:code,p_share:c});UI.sheet={type:"import",code:c,data:d};UI.confirm=null;render()}
  catch(e){if(e.code==="no_share")toast("Deze deelcode bestaat niet. Controleer de tekens.");else if(e.code==="net")toast("Geen verbinding. Probeer het opnieuw als je internet hebt.");else handleErr(e)}
}
async function importShare(){

/* ---------- planning ---------- */
function planList(){return Object.entries(S.plan||{}).map(([id,p])=>({id,...p}))}
function planKind(p){return p.type||"cardio"}
function planDoneFor(p){
  if(p.doneAt)return{kind:"check"};
  const s=planSession(S.sessions,p.id);if(s)return s;
  if(planKind(p)==="routine"&&p.routineId)return sortedSessions().find(x=>x.date===p.date&&x.routineId===p.routineId&&!x.planId)||null;
  return null;
}
function planTitle(p){const k=planKind(p);if(k==="routine")return S.routines[p.routineId]?.name||p.routineName||"Schema";if(k==="rest")return "Rustdag";return p.title||p.sport||"Training"}
function planChip(p){const k=planKind(p);return k==="routine"?"Kracht":k==="rest"?"Rust":k==="other"?"Overig":(p.sport||"Duur")}
function sessionSummary(s){if(!s)return "";if(s.kind==="check")return "Afgevinkt";if(s.kind==="cardio")return cardioSummary(s);const n=(s.entries||[]).reduce((t,e)=>t+(e.sets||[]).length,0);const e=(s.entries||[]).length;return `${e} oefening${e===1?"":"en"} · ${n} set${n===1?"":"s"}`}
function dayName(iso){const t=today();const w=new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"long"});const lbl=iso===t?"Vandaag":iso===addDays(t,1)?"Morgen":iso===addDays(t,-1)?"Gisteren":w.charAt(0).toUpperCase()+w.slice(1);return `${lbl} ${new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}`}
function weekStart(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d)}
function weekNo(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7)}
function planItemBtn(p,late){
  const k=planKind(p);
  if(k==="rest")return "";
  if(k==="routine")return `<button class="btn ${late?"":"primary"}" data-act="plan-start" data-id="${p.id}">Start training</button>`;
  if(k==="other")return `<button class="btn" data-act="pl-check" data-id="${p.id}">Afvinken als gedaan</button>`;
  return `<button class="btn ${late?"":"primary"}" data-act="plan-start" data-id="${p.id}">${late?"Toch nog loggen":"Training loggen"}</button>`;
}
function viewPlanCard(){
  const t=today(),to=addDays(t,14),from=addDays(t,-7);
  const all=planList();
  const show=all.filter(p=>{const done=planDoneFor(p);if(p.date===t)return true;if(!p.coach)return false;if(p.date>t&&p.date<=to)return true;return p.date<t&&p.date>=from&&!done})
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.updated||0)-(b.updated||0));
  if(!show.length)return "";
  return `<h2>Op je planning</h2><div class="stack">${show.map(p=>{
    const done=planDoneFor(p),late=!done&&p.date<t,k=planKind(p);
    const tg=k==="cardio"?planTargets(p):"",txt=p.desc||p.note||"";
    return `<article class="card plan k-${k}${done?" done":""}${late?" late":""}"><div class="ph"><span class="pd">${esc(dayLabel(p.date))}</span><span class="chip">${esc(planChip(p))}</span></div>
      <strong class="pt">${esc(planTitle(p))}</strong>${tg?`<span class="muted small">${tg}</span>`:""}
      ${txt?`<p class="pdesc">${esc(txt)}</p>`:""}
      ${done?`<div class="pdone">✓ Gedaan: ${sessionSummary(done)}</div>`:planItemBtn(p,late)}
      ${p.coach?`<span class="small muted">Van ${esc(p.coach)}${late?" · nog niet gelogd":""}</span>`:""}</article>`}).join("")}</div><button class="linkbtn" data-act="go-plan">Hele week bekijken →</button>`;
}
function viewPlan(){
  const t=today(),ws=UI.week||weekStart(t),days=[...Array(7)].map((_,i)=>addDays(ws,i)),items=planList();
  let planned=0,done=0;
  const dayHtml=days.map(d=>{
    const its=items.filter(p=>p.date===d).sort((a,b)=>(a.updated||0)-(b.updated||0));
    const linked=new Set(its.map(p=>{const x=planDoneFor(p);return x&&x.id}).filter(Boolean));
    const extra=sortedSessions().filter(s=>s.date===d&&!linked.has(s.id));
    its.forEach(p=>{if(planKind(p)!=="rest"){planned++;if(planDoneFor(p))done++}});
    return `<section class="day${d===t?" today":""}${d<t?" past":""}"><div class="dh"><span class="dn">${esc(dayName(d))}</span><button class="linkbtn" data-act="pl-add" data-id="${d}">+ Plannen</button></div>
      ${its.map(p=>planRow(p,d<t)).join("")}
      ${extra.map(s=>`<button class="prow done" data-act="open-session" data-id="${s.id}"><span class="pk">${s.kind==="cardio"?esc(s.sport):"Kracht"}</span><span class="pn">${esc(s.routineName||"Training")} <span class="muted small">· niet gepland</span></span><span class="ps">✓ ${sessionSummary(s)}</span></button>`).join("")}
      ${!its.length&&!extra.length?`<p class="dempty">Nog niets gepland</p>`:""}</section>`;

  return `<div class="weekbar card"><button class="ib wkb" data-act="wk-prev" aria-label="Vorige week">‹</button><div class="wk"><b>Week ${weekNo(ws)}</b><span class="muted small">${dateTxt(days[0])} – ${dateTxt(days[6])}</span></div><button class="ib wkb" data-act="wk-next" aria-label="Volgende week">›</button></div>
    <div class="weeksum">${planned?`<b>${done} van ${planned}</b> geplande training${planned>1?"en":""} gedaan`:"Nog niets gepland deze week"}${ws!==weekStart(t)?` · <button class="linkbtn" data-act="wk-today">naar deze week</button>`:""}</div>
    <div class="days">${dayHtml}</div>
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-act="wk-copy">Deze week kopiëren naar volgende week</button></div>
    <p class="small muted">Tik op een dag om een schema, duurtraining, rustdag of andere sport te plannen. Gedane trainingen krijgen vanzelf een vinkje.</p>`;
}

async function weekCopy(){
  const ws=UI.week||weekStart(today()),we=addDays(ws,6),items=planList();

  if(!src.length){toast("Er staat deze week nog niets in je eigen planning om te kopiëren.");return}

function checkResults(d){
  if(!d||d.type!=="results"||!Array.isArray(d.sessions)||!d.sessions.length)throw new Error("geen resultatenbestand");
  let n=0;for(const s of d.sessions){if(!Array.isArray(s.entries))throw new Error("training zonder oefeningen");for(const e of s.entries){if(!e.name||!Array.isArray(e.sets))throw new Error("oefening zonder naam of sets");n+=e.sets.length}}
  return n;
}
async function makeResultsCode(){
  let d;try{d=JSON.parse(document.getElementById("res-json")?.value||"");checkResults(d)}catch(e){toast("Dit is geen geldig resultatenbestand: "+e.message);return}
  d.by=S.me.name;
  try{const c=await rpc("kl_share_create",{p_code:code,p_profile:pid,p_pin:myPin(),p_data:d});UI.sheet={type:"share",code:c,name:d.name||"Resultaten",kind:"results"};render()}
  catch(e){if(e.code==="too_big")toast("Bestand is te groot. Splits het in delen.");else handleErr(e)}
}
async function importResults(d){
  const exMap=new Map(Object.entries(S.exercises).map(([id,x])=>[norm(x.name),id])),ex=[],ses=[];
  const resolve=(name,group)=>{const k=norm(name);if(exMap.has(k))return exMap.get(k);const id=uid();exMap.set(k,id);ex.push(["exercises",id,{name:String(name).slice(0,80),group:GROUPS.includes(group)?group:"Overig"}]);return id};
  d.sessions.forEach((s,i)=>{
    const date=/^\d{4}-\d{2}-\d{2}$/.test(s.date||"")?s.date:today();
    const entries=s.entries.map(e=>({exId:resolve(e.name,e.group),name:String(e.name),group:GROUPS.includes(e.group)?e.group:"Overig",sets:e.sets.map(x=>({k:+x.k||0,r:Math.round(+x.r||0)})).filter(x=>x.r>0)})).filter(e=>e.sets.length);
    if(entries.length)ses.push(["sessions",uid()+"i"+i,{date,ts:Date.parse(date+"T12:00:00")||Date.now(),routineId:null,routineName:String(s.name||"Geïmporteerde training").slice(0,80),entries,imported:true}]);
  });
  await runJobs(ex,put);await runJobs(ses,put);
  return ses.length;
}
function importSheet(sh){
  const d=sh.data||{};
  if(d.type==="results"){let n=0;try{n=checkResults(d)}catch(e){}
    return `<div class="sh"><h2>Resultaten importeren</h2><button class="ib" data-act="close-sheet" aria-label="Sluiten">✕</button></div><div class="card stack"><div><strong style="font-family:var(--display);font-size:22px">${esc(d.name||"Resultaten")}</strong>${d.by?`<div class="muted small">Klaargezet door ${esc(d.by)}</div>`:""}</div>
      <p class="hp">${d.sessions.length} training${d.sessions.length===1?"":"en"} met samen ${n} sets. Ze komen in je eigen account te staan, met de datum erbij als die bekend is. Je records worden daarna opnieuw berekend.</p>
      <button class="btn primary" data-act="sh-import">Toevoegen aan mijn account</button></div>`}
  const rs=d.routines||[];

    ${rs.map(r=>`<div class="fitem"><div class="fi-n">${esc(r.name)}</div><div class="fi-x">${(r.items||[]).map(i=>esc(i.name)).join(" · ")}</div></div>`).join("")}

    <button class="btn primary" data-act="sh-import">Toevoegen aan mijn schema's</button></div>`;
}

    if(q&&!exact)inner+=`<div class="card stack" style="margin-top:10px"><div><span class="muted small">Nieuwe oefening</span><br><strong>${esc(q)}</strong></div><label class="f">Spiergroep<select id="pk-g">${GROUPS.map(g=>`<option ${g===UI.pickG?"selected":""}>${g}</option>`).join("")}</select></label><button class="btn primary" data-act="create-ex">Toevoegen</button></div>`;
    inner+=`<div class="card" style="margin-top:10px;padding:4px 12px">`+(list.length?list.map(([id,x])=>{const t=takenKeys.has(norm(x.name));return `<button class="pickitem" data-act="pick-ex" data-id="${id}" ${t?"disabled":""}><span>${esc(x.name)}${t?' <span class="muted small">· al toegevoegd</span>':""}</span><span class="chip">${esc(x.group)}</span></button>`}).join(""):`<p class="muted small" style="padding:10px 0;margin:0">${Object.keys(S.exercises).length?"Geen oefening gevonden. Typ de naam om hem aan te maken.":"Je oefeningenlijst is nog leeg. Typ hierboven de naam van je eerste oefening."}</p>`)+`</div>`;
  }else if(sh.type==="ex"){
    const x=S.exercises[sh.id];if(!x){UI.sheet=null;el.hidden=true;return}
    const hist=historyFor(sh.id),b=bestFor(sh.id);
    inner=`<div class="sh"><h2>${esc(x.name)}</h2><button class="ib" data-act="close-sheet" aria-label="Sluiten">✕</button></div>
      <div class="card stack"><label class="f">Naam<input type="text" id="ex-name" value="${esc(sh.name)}"></label><label class="f">Spiergroep<select id="ex-g">${GROUPS.map(g=>`<option ${g===sh.group?"selected":""}>${g}</option>`).join("")}</select></label><button class="btn primary" data-act="save-ex">Wijzigingen opslaan</button></div>
      <h2>Geschiedenis</h2>${hist.length?`<div class="hist">`+hist.map(hh=>`<div class="h"><div class="d">${dateTxt(hh.date)} · ${esc(hh.name||"Training")}</div><div class="s">${hh.sets.map(shortSet).join(" · ")}</div></div>`).join("")+`</div>`:`<p class="muted">Nog niet gelogd.</p>`}
      ${b?`<p class="small muted">Record: <strong style="color:var(--pr)">${setTxt(b.set)}</strong> op ${dateTxt(b.date)}</p>`:""}
      <div style="margin-top:14px">${UI.confirm==="del-ex"?`<div class="confirm"><span>Oefening verwijderen uit je lijst? Gelogde trainingen blijven bewaard, maar de oefening verdwijnt uit records en schema's.</span><div class="btnrow"><button class="btn danger" data-act="del-ex-yes">Verwijderen</button><button class="btn" data-act="confirm-no">Behouden</button></div></div>`:`<button class="btn ghost danger" data-act="del-ex">Oefening verwijderen</button>`}</div>`;
  }else if(sh.type==="session"){
    const s=S.sessions[sh.id];if(!s){UI.sheet=null;el.hidden=true;return}
    if(s.kind==="cardio"){const v=speed(s.durMin,s.km);
      inner=`<div class="sh"><h2>${esc(s.sport)} · ${dateTxt(s.date)}</h2><button class="ib" data-act="close-sheet" aria-label="Sluiten">✕</button></div>${s.planTitle?`<p class="small muted" style="margin:0 0 8px">Geplande training: <b>${esc(s.planTitle)}</b></p>`:""}<div class="card"><div class="calc">
        <div><span>Duur</span><b>${durTxt(s.durMin)}</b></div>${s.km?`<div><span>Afstand</span><b>${fmt1(s.km)} km</b></div>`:""}${v?`<div><span>Gem. snelheid</span><b>${fmt1(v)} km/u</b></div>`:""}${v&&s.sport==="Hardlopen"?`<div><span>Tempo</span><b>${paceTxt(s.durMin,s.km)}</b></div>`:""}${s.avgHr?`<div><span>Gem. hartslag</span><b>${s.avgHr} bpm</b></div>`:""}${s.maxHr?`<div><span>Max. hartslag</span><b>${s.maxHr} bpm</b></div>`:""}${s.purpose?`<div><span>Soort training</span><b>${esc(s.purpose)}</b></div>`:""}</div>${s.note?`<p class="hp" style="margin-top:10px">${esc(s.note)}</p>`:""}</div>`;
    }else inner=`<div class="sh"><h2>${esc(s.routineName||"Training")} · ${dateTxt(s.date)}</h2><button class="ib" data-act="close-sheet" aria-label="Sluiten">✕</button></div><div class="hist">`+
      (s.entries||[]).map(e=>`<div class="h"><div class="d">${esc(exName(e.exId,e.name))}</div><div class="s">${e.sets.map(shortSet).join(" · ")}</div></div>`).join("")+`</div>`;
    inner+=`<div style="margin-top:14px">${UI.confirm==="del-session"?`<div class="confirm"><span>Deze training verwijderen? Records worden opnieuw berekend.</span><div class="btnrow"><button class="btn danger" data-act="del-session-yes">Verwijderen</button><button class="btn" data-act="confirm-no">Behouden</button></div></div>`:`<button class="btn ghost danger" data-act="del-session">Training verwijderen</button>`}</div>`;
  }
  if(EXTRA_SHEETS[sh.type]){inner=EXTRA_SHEETS[sh.type](sh);if(inner==null){UI.sheet=null;el.hidden=true;el.innerHTML="";return}}
  el.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}

let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- events ---------- */
function addExercise(exId){
  if(UI.sheet.mode==="draft"){draft.entries.push(entryFor(exId,null));saveDraft()}
  else UI.edit.items.push({exId,sets:"",reps:""});
  UI.sheet=null;UI.pickQ="";render();
}

    case "coach-open":UI.coach={who:null,data:null,form:null};UI.confirm=null;UI.tab="train";lsSet(LS_TAB,"train");if(!S.people)loadPeople();render();window.scrollTo(0,0);break;
    case "coach-close":UI.coach=null;UI.confirm=null;render();window.scrollTo(0,0);break;
    case "co-new":UI.coach.form={id:null,date:addDays(today(),1),sport:"Hardlopen",title:"",purpose:"",durMin:"",km:"",desc:"",repeat:"1"};UI.confirm=null;render();setTimeout(()=>document.getElementById("co-title")?.focus(),30);break;
    case "co-edit":{const p=UI.coach.data.plan[id];UI.coach.form={id,date:p.date,sport:p.sport,title:p.title,purpose:p.purpose||"",durMin:p.durMin??"",km:p.km!=null?String(p.km).replace(".",","):"",desc:p.desc||"",repeat:"1"};UI.confirm=null;render();window.scrollTo(0,0);break}
    case "co-copy":{const f=UI.coach.form;f.id=null;f.date=addDays(f.date,7);render();toast("Kopie gemaakt, een week later. Pas aan en tik op Inplannen.");break}
    case "co-sport":UI.coach.form.sport=b.dataset.v;render();break;

    case "c-save":await saveCardio();break;
    case "c-cancel":UI.cardio=null;saveCardioDraft();render();break;

    case "create-profile":{const n=document.getElementById("np-name")?.value||"";const t=document.getElementById("np-tpl");await createProfile(n,t?t.checked:false);break}
    case "logout":logout();break;
    case "start":startWorkout(id||null);break;
    case "start-from-schema":UI.tab="train";lsSet(LS_TAB,"train");if(draft){toast("Er loopt al een training. Rond die eerst af.");render()}else startWorkout(id);break;
    case "fill":{const ph=placeholderFor(draft.entries[i],j);if(ph){draft.entries[i].sets[j]={k:ph.k?String(ph.k).replace(".",","):"",r:String(ph.r)};saveDraft();render()}else toast("Nog geen vorige set om over te nemen.");break}
    case "add-set":{const e=draft.entries[i],prev=e.sets[e.sets.length-1];e.sets.push(prev&&(prev.k!==""||prev.r!=="")?{...prev}:{k:"",r:""});saveDraft();render();break}
    case "set-remove":draft.entries[i].sets.splice(j,1);saveDraft();render();break;
    case "ex-up":[draft.entries[i-1],draft.entries[i]]=[draft.entries[i],draft.entries[i-1]];saveDraft();render();break;
    case "ex-down":[draft.entries[i+1],draft.entries[i]]=[draft.entries[i],draft.entries[i+1]];saveDraft();render();break;

    case "open-session":UI.sheet={type:"session",id};UI.confirm=null;render();break;
    case "del-session":UI.confirm="del-session";render();break;
    case "del-session-yes":await del("sessions",UI.sheet.id);UI.sheet=null;UI.confirm=null;toast("Training verwijderd");render();break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target,id=t.id||"";let m;
  if((m=id.match(/^s-(\d+)-(\d+)-([kr])$/))&&draft){
    const e=draft.entries[+m[1]],st=e.sets[+m[2]];st[m[3]]=t.value;saveDraft();
    const f=document.getElementById(`f-${m[1]}-${m[2]}`);if(f)f.textContent=rowIsPR(e,st)?"PR":"";
  }else if(id==="d-date"&&draft){draft.date=t.value||today();saveDraft()}
  else if(id==="np-name")UI.newName=t.value;
  else if(id.startsWith("pf-")&&UI.pf!==undefined){const f=pfDraft();if(id==="pf-age")f.age=t.value;else if(id==="pf-height")f.height=t.value;else if(id==="pf-target")f.targetWeight=t.value;else if(id==="pf-work")f.work=t.value;else{const mm=id.match(/^pf-([nm])-(\w+)$/);if(mm){f.sports[mm[2]]=f.sports[mm[2]]||{};f.sports[mm[2]][mm[1]==="n"?"n":"min"]=t.value}}}
  else if(id.startsWith("c-")&&UI.cardio){const map={"c-date":"date","c-h":"h","c-m":"m","c-s":"s","c-km":"km","c-avg":"avgHr","c-max":"maxHr","c-note":"note"};if(map[id])UI.cardio[map[id]]=t.value;saveCardioDraft();const lv=document.getElementById("c-live");if(lv)lv.innerHTML=cardioLive()}
  else if(id==="np-tpl")UI.useTemplate=t.checked;
  else if(id==="li-name")UI.loginName=t.value;
  else if(id.startsWith("co-")&&UI.coach&&UI.coach.form){const map={"co-date":"date","co-title":"title","co-dur":"durMin","co-km":"km","co-desc":"desc","co-rep":"repeat"};if(map[id])UI.coach.form[map[id]]=t.value}
  else if(id==="re-name"&&UI.edit)UI.edit.name=t.value;
  else if((m=id.match(/^re-([srn])-(\d+)$/))&&UI.edit)UI.edit.items[+m[2]][{s:"sets",r:"reps",n:"note"}[m[1]]]=t.value;
  else if(id==="fd-name"&&UI.folderEdit)UI.folderEdit.name=t.value;
  else if(id.startsWith("pa-")&&UI.sheet&&UI.sheet.type==="pl-add"){const map={"pa-title":"title","pa-dur":"durMin","pa-km":"km","pa-note":"note"};if(map[id])UI.sheet[map[id]]=t.value}
  else if(id==="pk-q"){UI.pickQ=t.value;renderSheet();const el=document.getElementById("pk-q");if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}}
  else if(id==="pk-g")UI.pickG=t.value;
  else if(id==="rec-q"){UI.recQ=t.value;render()}
});

  if(ev.target.id==="co-rep"&&UI.coach&&UI.coach.form)UI.coach.form.repeat=ev.target.value;
  if(ev.target.id==="imp-file"&&ev.target.files&&ev.target.files[0]){const f=ev.target.files[0];const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);UI.importObj=o;UI.confirm="import";render()}catch(e){toast("Dit bestand kan niet gelezen worden.")}};rd.readAsText(f);ev.target.value=""}
if(ev.target.id==="pk-g")UI.pickG=ev.target.value;if(ev.target.id==="np-tpl")UI.useTemplate=ev.target.checked});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&UI.sheet){UI.sheet=null;UI.confirm=null;render()}if(ev.key==="Enter"&&(ev.target.id==="pin-1"||ev.target.id==="pin-2")){ev.preventDefault();document.querySelector('[data-act="submit-firstpin"]')?.click()}if(ev.key==="Enter"&&(ev.target.id==="li-name"||ev.target.id==="li-pin")){ev.preventDefault();if(ev.target.id==="li-name")document.getElementById("li-pin")?.focus();else document.querySelector('[data-act="submit-login"]')?.click()}if(ev.key==="Enter"&&ev.target.id==="sh-code"){ev.preventDefault();document.querySelector('[data-act="sh-lookup"]')?.click()}if(ev.key==="Enter"&&ev.target.id==="fd-name"){ev.preventDefault();document.querySelector('[data-act="fd-save"]')?.click()}if(ev.key==="Enter"&&ev.target.id==="gc-code"){ev.preventDefault();document.querySelector('[data-act="submit-code"]')?.click()}if(ev.key==="Enter"&&ev.target.id==="np-name"){ev.preventDefault();document.querySelector('[data-act="create-profile"]')?.click()}});

{const mm=location.hash.match(/deel=([A-Za-z0-9]{6})/);if(mm){UI.pendingShare=mm[1].toUpperCase();try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}}
window.addEventListener("hashchange",()=>{const mm=location.hash.match(/deel=([A-Za-z0-9]{6})/);if(!mm)return;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}if(pid&&S.ready)lookupShare(mm[1]);else{UI.pendingShare=mm[1].toUpperCase();render()}});
