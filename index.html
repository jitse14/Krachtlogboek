<style>
/* Layout: one narrow phone column, sticky header, fixed bottom tab bar, bottom sheets for pickers */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E3E6E1; --fg:#15181B; --muted:#5F666D; --line:#D5D9D3;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --pr:#A86A00; --pr-bg:#FCEFD3; --danger:#B3261E; --good:#2E7D4F; --warn:#B26A00; --bad:#C62828;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1E; --sunk:#202429; --fg:#ECEEF1; --muted:#949AA2; --line:#2A2F35;
  --accent:#7290FF; --accent-ink:#0B0D10; --pr:#F2B544; --pr-bg:#3A2C10; --danger:#FF8A80; --good:#5CCB8A; --warn:#F2B544; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1E; --sunk:#202429; --fg:#ECEEF1; --muted:#949AA2; --line:#2A2F35;
  --accent:#7290FF; --accent-ink:#0B0D10; --pr:#F2B544; --pr-bg:#3A2C10; --danger:#FF8A80; --good:#5CCB8A; --warn:#F2B544; --bad:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2E9E5B}.dot.warn{background:var(--pr)}
h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-radius:4px;padding:2px 6px}
.empty{text-align:left;padding:18px}
.empty p{margin:0 0 12px}
.empty strong{font-family:var(--display);font-size:20px;display:block;margin-bottom:4px}
/* routine start cards */
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.start .name{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.start .go{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.06em;text-transform:uppercase;flex:none}
/* active workout */
.wohead{display:grid;gap:8px;margin-top:16px}
.wohead .title{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,.num{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;min-height:44px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.icons{display:flex;gap:2px;flex:none}
.ib{appearance:none;border:0;background:transparent;width:36px;height:36px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:17px;display:grid;place-items:center}
.ib:hover{background:var(--sunk)}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px;padding:0}
.refs div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.refs dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.refs dd{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.refs dd small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.refs .best{background:var(--pr-bg)}
.refs .best dd{color:var(--pr)}
.refs .target{grid-column:1/-1}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 44px 36px;gap:6px;align-items:center}
.sethead{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sethead span:nth-child(2),.sethead span:nth-child(3){padding-left:4px}
.setn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:44px;font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.num{text-align:center;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 4px}
.num::placeholder{color:var(--muted);opacity:.55}
.flag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--pr);text-align:center}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.addset{margin-top:8px}
.confirm{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:10px}
/* records */
.recgroup{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .b{font-family:var(--display);font-weight:700;font-size:19px;color:var(--pr);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

const UI={tab:"train",sheet:null,edit:null,recQ:"",pickQ:"",pickG:"Borst",confirm:null,login:"ask",newName:"",useTemplate:true,pf:null,cardio:null,pinOpen:false,pinFor:null,loginName:"",coach:null,delWho:null,folderEdit:null,week:null,pendingShare:null};
let db=null,pid=null,unsubs=[],draft=null;

function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function num(v){if(v==null||v==="")return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null}
function kgTxt(k){return k?(Math.round(k*100)/100).toString().replace(".",",")+" kg":"BW"}
function setTxt(s){return kgTxt(s.k)+" × "+s.r}
function shortSet(s){return (s.k?(Math.round(s.k*100)/100).toString().replace(".",","):"BW")+"×"+s.r}
function dateTxt(iso){if(!iso)return"";const d=new Date(iso+"T12:00:00");const o={day:"numeric",month:"short"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";return d.toLocaleDateString("nl-NL",o)}
function better(a,b){return !b||a.k>b.k||(a.k===b.k&&a.r>b.r)}
function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
const draftKey=()=>"krachtlogboek.draft."+pid;

const savedTab=lsGet(LS_TAB); if(savedTab&&["train","plan","schemas","records","profile","food","help","news","privacy","together"].includes(savedTab))UI.tab=savedTab;

const TEMPLATE={"exercises": {"r-dip": {"name": "Ring Dip", "group": "Borst"}, "r-widepull": {"name": "Wide Ring Pull-up", "group": "Rug"}, "r-archerpush": {"name": "Ring Archer Push-up", "group": "Borst"}, "r-archerrow": {"name": "Ring Archer Row", "group": "Rug"}, "r-shoulderpush": {"name": "Ring Shoulder Push-up", "group": "Schouders"}, "r-pelican": {"name": "Pelican Curl", "group": "Biceps"}, "r-tricepext": {"name": "Ring Tricep Extension", "group": "Triceps"}, "r-facepull": {"name": "Ring Face Pull", "group": "Schouders"}, "r-rollout": {"name": "Ring Rollout", "group": "Core"}, "c-dip": {"name": "Dips (parallel bar)", "group": "Borst"}, "c-pullup": {"name": "Pull-up", "group": "Rug"}, "c-archerpush": {"name": "Archer Push-up", "group": "Borst"}, "c-austrow": {"name": "Australian Row", "group": "Rug"}, "c-pike": {"name": "Pike Push-up", "group": "Schouders"}, "c-chinup": {"name": "Chin-up", "group": "Biceps"}, "c-diamond": {"name": "Diamond Push-up", "group": "Triceps"}, "c-legraise": {"name": "Hanging Leg Raise", "group": "Core"}, "c-bss": {"name": "Bulgarian Split Squat (BW)", "group": "Benen"}, "f-bench": {"name": "Bench Press", "group": "Borst"}, "f-latpull": {"name": "Lat Pulldown", "group": "Rug"}, "f-ohp": {"name": "Overhead Press", "group": "Schouders"}, "f-row": {"name": "Barbell Row", "group": "Rug"}, "f-squat": {"name": "Squat", "group": "Benen"}, "f-rdl": {"name": "Romanian Deadlift", "group": "Billen"}, "f-fly": {"name": "Dumbbell Chest Fly", "group": "Borst"}, "f-facepull": {"name": "Cable Face Pull", "group": "Schouders"}, "f-curl": {"name": "EZ-bar Curl", "group": "Biceps"}, "f-pushdown": {"name": "Triceps Pushdown", "group": "Triceps"}}, "routines": {"rt-ringen": {"items": [{"exId": "r-dip", "reps": "8-10", "sets": "3"}, {"exId": "r-widepull", "reps": "6-8", "sets": "3"}, {"exId": "r-archerpush", "reps": "6-8", "sets": "3"}, {"exId": "r-archerrow", "reps": "8-10", "sets": "3"}, {"exId": "r-shoulderpush", "reps": "8-10", "sets": "3"}, {"exId": "r-pelican", "reps": "6-8", "sets": "3"}, {"exId": "r-tricepext", "reps": "10-12", "sets": "3"}, {"exId": "r-facepull", "reps": "12-15", "sets": "3"}, {"exId": "r-rollout", "reps": "8-10", "sets": "3"}], "name": "Ringen — Push/Pull", "order": 0}, "rt-fitness": {"items": [{"exId": "f-bench", "reps": "6-8", "sets": "4"}, {"exId": "f-latpull", "reps": "8-10", "sets": "4"}, {"exId": "f-ohp", "reps": "6-8", "sets": "3"}, {"exId": "f-row", "reps": "8-10", "sets": "3"}, {"exId": "f-squat", "reps": "6-8", "sets": "4"}, {"exId": "f-rdl", "reps": "8-10", "sets": "3"}, {"exId": "f-fly", "reps": "10-12", "sets": "3"}, {"exId": "f-facepull", "reps": "12-15", "sets": "3"}, {"exId": "f-curl", "reps": "10-12", "sets": "3"}, {"exId": "f-pushdown", "reps": "10-12", "sets": "3"}], "name": "Fitness — Gewichten", "order": 2}, "rt-cali": {"items": [{"exId": "c-dip", "reps": "8-10", "sets": "3"}, {"exId": "c-pullup", "reps": "6-8", "sets": "3"}, {"exId": "c-archerpush", "reps": "6-8", "sets": "3"}, {"exId": "c-austrow", "reps": "10-12", "sets": "3"}, {"exId": "c-pike", "reps": "8-10", "sets": "3"}, {"exId": "c-chinup", "reps": "6-8", "sets": "3"}, {"exId": "c-diamond", "reps": "10-12", "sets": "3"}, {"exId": "c-bss", "reps": "10-12", "sets": "3"}, {"exId": "c-legraise", "reps": "10", "sets": "3"}], "name": "Calisthenics — Full body", "order": 1}}};
S.template=TEMPLATE;
/* ---------- store (Supabase) ---------- */
const CFG={url:"https://vxmdbjtuuvrryazrnkfx.supabase.co",key:"sb_publishable_RhOl_un8Ik35a73T3QLThA_niKqiuTQ"};
const LS_CODE="krachtlogboek.code",LS_ME="krachtlogboek.me";
const COLLS=["exercises","routines","sessions","meta","weights","plan","folders","foodlog","foods","archive","meals","mealplans"];
let code=lsGet(LS_CODE),loadedAt=0,flushing=false;
const pinKey=id=>"krachtlogboek.pin."+id;
const qKey=id=>"krachtlogboek.queue."+id;
const cacheKey=id=>"krachtlogboek.cache."+id;
const cardioKey=()=>"krachtlogboek.cardio."+pid;
const myPin=()=>lsGet(pinKey(pid));
const queue=()=>pid?(lsGet(qKey(pid))||[]):[];
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoOf(d)}
async function rpc(fn,args){
  const h={"Content-Type":"application/json","apikey":CFG.key};
  if(!CFG.key.startsWith("sb_publishable_"))h.Authorization="Bearer "+CFG.key;
  let r;
  try{r=await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)})}
  catch(e){const err=new Error("offline");err.code="net";throw err}
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}
    const err=new Error(m||("HTTP "+r.status));
    err.code=/groepscode/i.test(m)?"bad_code":/persoonlijke code/i.test(m)?"bad_pin":/te kort/i.test(m)?"short_pin":/beheerder/i.test(m)?"not_admin":/bestaat al/i.test(m)?"dup_name":/eigen account/i.test(m)?"self":/naam ontbreekt/i.test(m)?"no_name":/geen toestemming/i.test(m)?"no_perm":/te veel/i.test(m)?"too_many":/niet gevonden/i.test(m)?"no_share":/te groot/i.test(m)?"too_big":"net";throw err}
  const t=await r.text();return t?JSON.parse(t):null;
}
function initStore(){
  S.profilesReady=true;
  if(!code){UI.login="code";render();return}
  const me=lsGet(LS_ME);
  if(me&&me.id&&lsGet(pinKey(me.id))){enterProfile(me);return}
  UI.login="login";render();
}
async function submitCode(c){
  c=String(c||"").trim();if(!c){toast("Vul de groepscode in.");return}
  try{await rpc("kl_code_ok",{p_code:c});code=c;lsSet(LS_CODE,c);UI.login="login";render();setTimeout(()=>document.getElementById("li-name")?.focus(),30)}
  catch(e){toast(e.code==="bad_code"?"Deze groepscode klopt niet. Vraag de juiste code na.":"Geen verbinding. Controleer je internet en probeer het opnieuw.")}
}
async function submitLogin(){
  const name=(document.getElementById("li-name")?.value||"").trim(),pin=(document.getElementById("li-pin")?.value||"").trim();
  UI.loginName=name;
  if(!name){toast("Vul je naam in.");return}
  try{
    const r=((await rpc("kl_login_name",{p_code:code,p_name:name,p_pin:pin}))||[])[0];
    if(!r){toast("Naam of code klopt niet.");return}
    if(!r.id&&r.name==="__locked__"){toast("Te veel foute pogingen. Probeer het over 15 minuten opnieuw, of vraag Jitse om je code opnieuw in te stellen.");return}
    if(r.needs_pin){UI.login="setpin";UI.pinFor={id:r.id,name:r.name,isAdmin:!!r.is_admin};render();setTimeout(()=>document.getElementById("pin-1")?.focus(),30);return}
    lsSet(pinKey(r.id),pin);enterProfile({id:r.id,name:r.name,isAdmin:!!r.is_admin});
  }catch(e){
    if(e.code==="bad_pin")toast("Naam of code klopt niet. Code vergeten? Vraag Jitse om een nieuwe.");
    else if(e.code==="bad_code")handleErr(e);
    else toast("Geen verbinding. Controleer je internet en probeer het opnieuw.");
  }
}
async function submitFirstPin(){
  const p=UI.pinFor,a=(document.getElementById("pin-1")?.value||"").trim(),b=(document.getElementById("pin-2")?.value||"").trim();
  if(!p)return;
  if(a.length<6){toast("Kies een code van minimaal 6 tekens.");return}
  if(a!==b){toast("De twee codes zijn niet gelijk.");return}
  try{await rpc("kl_set_first_pin",{p_code:code,p_profile:p.id,p_pin:a});lsSet(pinKey(p.id),a);enterProfile(p);toast("Persoonlijke code ingesteld")}
  catch(e){handleErr(e)}
}
function enterProfile(me){
  pid=me.id;S.me={name:me.name,isAdmin:!!me.isAdmin};lsSet(LS_ME,{id:me.id,name:me.name,isAdmin:!!me.isAdmin});lsSet(LS_PROFILE,me.id);
  COLLS.forEach(c=>S[c]={});S.ready=false;S.people=null;S.social=null;inboxDone.clear();loadedAt=0;
  draft=lsGet(draftKey());UI.cardio=lsGet(cardioKey());UI.sheet=null;UI.edit=null;UI.confirm=null;UI.coach=null;UI.login="login";UI.pinFor=null;UI.shop2=null;UI.planEdit=null;UI.mealEdit=null;UI.shopMode=null;UI.foodTab=null;
  const cache=lsGet(cacheKey(me.id));
  if(cache){COLLS.forEach(c=>S[c]=cache[c]||{});applyQueue();S.ready=true}
  render();reloadData(me.id);
}
async function reloadData(id){
  await flushQueue();
  if(pid!==id)return;
  try{
    const rows=await rpc("kl_load",{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id))});
    if(pid!==id)return;
    const o={};COLLS.forEach(c=>o[c]={});
    (rows||[]).forEach(r=>{if(o[r.coll])o[r.coll][r.id]=r.data});
    COLLS.forEach(c=>S[c]=o[c]);applyQueue();saveCache();
    S.ready=true;S.mode=queue().length?"offline":"cloud";loadedAt=Date.now();render();
    if(S.me&&S.me.isAdmin&&!S.people)loadPeople();
    await seedStandard();
    try{const nc=await rpc("kl_current_code",{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id))});if(nc&&nc!==code){code=nc;lsSet(LS_CODE,nc)}}catch(e){}
    loadPrices();
    await compactOld();
    await migrateGroups();
    loadSocial();
    if(UI.pendingShare&&pid===id){const c=UI.pendingShare;UI.pendingShare=null;lookupShare(c)}
  }catch(e){if(pid===id)handleErr(e)}
}
function applyQueue(){for(const q of queue()){if(q.op==="put")S[q.col]={...S[q.col],[q.id]:q.data};else{const n={...S[q.col]};delete n[q.id];S[q.col]=n}}}
function saveCache(){if(!pid)return;const o={};COLLS.forEach(c=>o[c]=S[c]);lsSet(cacheKey(pid),o)}
function enqueue(op,col,id,data){const q=queue().filter(x=>!(x.col===col&&x.id===id));q.push({op,col,id,data:data??null});lsSet(qKey(pid),q)}
async function flushQueue(){
  if(flushing||!pid)return;
  const id=pid;let q=lsGet(qKey(id))||[];if(!q.length)return;
  flushing=true;let sent=0;
  try{
    while(q.length&&pid===id){
      const it=q[0];
      try{await rpc(it.op==="put"?"kl_put":"kl_del",it.op==="put"?{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id)),p_coll:it.col,p_id:it.id,p_data:it.data}:{p_code:code,p_profile:id,p_pin:lsGet(pinKey(id)),p_coll:it.col,p_id:it.id})}
      catch(e){if(e.code==="bad_pin"||e.code==="bad_code")handleErr(e);break}

    }
  }finally{flushing=false}

async function del(col,id){

/* ---------- derived ---------- */
function sortedSessions(){return Object.entries(S.sessions).map(([id,s])=>({id,...s})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0))}
function exName(id,fallback){return S.exercises[id]?.name||fallback||"Onbekende oefening"}
function exGroup(id,fallback){return S.exercises[id]?.group||fallback||"Overig"}
function exKey(id){return norm(exName(id))}
function entryKey(e){return S.exercises[e.exId]?norm(S.exercises[e.exId].name):norm(e.name)}
function bestFor(exId){
  const k=exKey(exId);let best=null,date=null;
  for(const s of Object.values(S.sessions))for(const e of s.entries||[])if(entryKey(e)===k)for(const st of e.sets||[])if(st.r>0&&better(st,best)){best=st;date=s.date}
  return best?{set:best,date}:null;
}
function lastFor(exId){
  const k=exKey(exId);
  for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)return{sets:e.sets,date:s.date,name:s.routineName}}
  return null;
}
function historyFor(exId){const k=exKey(exId);const out=[];for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)out.push({date:s.date,name:s.routineName,sets:e.sets})}return out}

function saveDraft(){if(pid)lsSet(draftKey(),draft)}
function entryFor(exId,target){
  const last=lastFor(exId);
  const n=parseInt(target?.sets)||(last?last.sets.length:0)||3;
  return{exId,name:exName(exId),group:exGroup(exId),target:target&&(target.sets||target.reps||target.note)?{sets:target.sets||"",reps:target.reps||"",note:target.note||""}:null,sets:Array.from({length:n},()=>({k:"",r:""}))};
}
function startWorkout(routineId,plan){
  const r=routineId?S.routines[routineId]:null;
  draft={id:uid(),date:today(),planId:plan?.id||null,routineId:routineId||null,routineName:r?r.name:"Losse training",entries:r?(r.items||[]).filter(i=>S.exercises[i.exId]).map(i=>entryFor(i.exId,i)):[]};
  saveDraft();UI.confirm=null;render();window.scrollTo(0,0);
}
function placeholderFor(entry,j){const last=lastFor(entry.exId);if(!last)return null;return last.sets[j]||last.sets[last.sets.length-1]}
function rowIsPR(entry,st){const r=num(st.r);if(!r||r<=0)return false;const k=num(st.k)||0;const b=bestFor(entry.exId);return !b||better({k,r},b.set)}
async function finishWorkout(){
  const entries=draft.entries.map(e=>({exId:e.exId,name:exName(e.exId,e.name),group:exGroup(e.exId,e.group),sets:e.sets.map(s=>({k:num(s.k)||0,r:Math.round(num(s.r)||0)})).filter(s=>s.r>0)})).filter(e=>e.sets.length);
  if(!entries.length){toast("Vul minstens één set in met herhalingen.");return}
  let prs=0;for(const e of entries){let b=bestFor(e.exId)?.set||null;for(const s of e.sets)if(better(s,b)){prs++;b=s}}
  const id=draft.id||uid();
  const rec={date:draft.date||today(),ts:Date.now(),routineId:draft.routineId,routineName:draft.routineName,entries};
  if(draft.planId&&S.plan[draft.planId]){rec.planId=draft.planId;rec.planTitle=planTitle({id:draft.planId,...S.plan[draft.planId]})}
  draft=null;saveDraft();UI.confirm=null;
  const ok=await put("sessions",id,rec);
  if(!ok)toast("Geen internet: training bewaard op je telefoon. Wordt automatisch verstuurd zodra je verbinding hebt.");
  else toast(prs?`Training opgeslagen · ${prs} nieuw${prs>1?"e":""} record${prs>1?"s":""}`:"Training opgeslagen");
  render();window.scrollTo(0,0);
}

function viewRecords(){const t=UI.recTab||"voortgang";return `<div class="seg seg2" style="margin-top:16px"><button class="segb" data-act="rec-tab" data-v="voortgang" aria-pressed="${t==="voortgang"}">Voortgang</button><button class="segb" data-act="rec-tab" data-v="records" aria-pressed="${t==="records"}">Records</button></div>`+(t==="voortgang"?viewProgress():viewStrengthRecords()+viewCardioRecords())}
function viewStrengthRecords(){
  const q=UI.recQ.trim().toLowerCase();
  const seen=new Set();
  const list=Object.entries(S.exercises).filter(([xid])=>bestFor(xid)).sort((a,b)=>a[1].name.localeCompare(b[1].name)).filter(([,x])=>{const k=norm(x.name);if(seen.has(k))return false;seen.add(k);return !q||x.name.toLowerCase().includes(q)});
  let h=`<h2>Hoogste resultaten</h2><input type="search" id="rec-q" placeholder="Zoek een oefening" value="${esc(UI.recQ)}" autocomplete="off">`;
  if(!Object.keys(S.exercises).some(xid=>bestFor(xid)))return h+`<div class="card empty" style="margin-top:12px"><strong>Nog geen records</strong><p class="muted">Zodra je een training logt, verschijnt hier per spiergroep je zwaarste set: meeste kg, en bij gelijk gewicht de meeste reps.</p></div>`;
  if(!list.length)return h+`<p class="muted">Geen oefening gevonden voor "${esc(UI.recQ)}".</p>`;
  const groups=[...GROUPS,...new Set(list.map(([,x])=>x.group).filter(g=>!GROUPS.includes(g)))];
  for(const g of groups){
    const rows=list.filter(([,x])=>(x.group||"Overig")===g);
    if(!rows.length)continue;
    h+=`<h2>${esc(g)}</h2><div class="recgroup">`+rows.map(([id,x])=>{const b=bestFor(id),l=lastFor(id);
      return `<button class="row" data-act="open-ex" data-id="${id}"><span class="n">${esc(x.name)}</span>${b?`<span class="b">${setTxt(b.set)}</span>`:`<span class="b none">Nog niet gelogd</span>`}${l?`<span class="l">Laatste ${dateTxt(l.date)}: ${l.sets.map(shortSet).join(" · ")}${b?` · record ${dateTxt(b.date)}`:""}</span>`:""}</button>`}).join("")+`</div>`;
  }
  return h;
}

function sparkline(list){
  if(list.length<2)return "";
  const W=320,H=70,P=6,ks=list.map(x=>x.kg),mn=Math.min(...ks),mx=Math.max(...ks),rg=(mx-mn)||1;
  const pts=list.map((x,i)=>[P+i*(W-2*P)/(list.length-1),H-P-(x.kg-mn)/rg*(H-2*P)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverloop van ${fmt1(ks[0])} naar ${fmt1(ks[ks.length-1])} kg"><path d="${d} L${last[0]} ${H} L${pts[0][0]} ${H} Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}

function nutrition(){
  const b=bodyMeta(),w=currentWeight(),miss=[];
  if(!b.age)miss.push("leeftijd");if(!b.height)miss.push("lengte");if(!b.sex)miss.push("geslacht");if(!w)miss.push("gewicht");if(!b.goal)miss.push("doel");
  if(miss.length)return{miss};
  const bmr=10*w+6.25*b.height-5*b.age+(b.sex==="Man"?5:b.sex==="Vrouw"?-161:-78);
  const wk=WORK.find(x=>x[0]===b.work)||WORK[2],steps=b.steps>0?b.steps:null;
  let base,neatTxt;
  if(steps){const stepK=Math.max(0,steps-3000)*0.0006*w,workK=wk[3]*bmr;base=bmr*1.2+stepK+workK;neatTxt={steps,stepK,workK}}
  else{base=bmr*wk[2];neatTxt=null}
  let weekly=0,sessions=0,strMin=0,endMin=0,mixMin=0;
  for(const [k,,met,dm,type] of SPORTS){const s=(b.sports||{})[k];if(!s||!s.n)continue;const mins=s.min||dm;weekly+=s.n*(mins/60)*(met-1)*w;sessions+=s.n;
    if(type==="kracht")strMin+=s.n*mins;else if(type==="duur")endMin+=s.n*mins;else mixMin+=s.n*mins}
  const endH=(endMin+mixMin*0.5)/60,strH=strMin/60;
  const ptype=endH>=2&&endH>=2*strH?"duur":strH>0&&strH>=2*endH?"kracht":(endH||strH)?"gemengd":"rust";
  const tdee=base+weekly/7;
  const goal=b.goal;
  let adj=goal==="afvallen"?Math.max(-0.2*tdee,-750):goal==="droog_heavy"?-500:goal==="droog_lean"?-250:goal==="bulk_lean"?200:goal==="bulk_heavy"?400:0;
  let kcal=tdee+adj;const floor=Math.max(bmr*1.1,b.sex==="Vrouw"?1400:1600);let floored=false;
  if(kcal<floor){kcal=floor;floored=true}
  const adviceKcal=kcal;
  const nut=b.nut||{};let manualK=false,manualP=false;
  if(nut.kcal>=1000&&nut.kcal<=7000){kcal=nut.kcal;manualK=true}
  let pPerKg={afvallen:2.0,droog_heavy:2.3,droog_lean:2.1,onderhoud:1.7,bulk_lean:1.8,bulk_heavy:1.8}[goal]||1.8;
  if(ptype==="duur"&&!isCut(goal))pPerKg=1.6;
  const carbFloor=endH>=10?7:endH>=7?6:endH>=4?5:endH>=2?4:0;
  let protein=pPerKg*w,fat=Math.max(0.25*kcal/9,0.8*w),carbs=(kcal-protein*4-fat*9)/4,carbShort=false;
  if(carbFloor&&carbs<carbFloor*w){fat=Math.max(0.2*kcal/9,0.7*w);carbs=(kcal-protein*4-fat*9)/4;if(carbs<carbFloor*w-5)carbShort=true}
  carbs=Math.max(0,carbs);
  const pct=nut.pct;
  if(pct&&Math.abs(pct.p+pct.c+pct.f-100)<0.6){protein=kcal*pct.p/100/4;carbs=kcal*pct.c/100/4;fat=kcal*pct.f/100/9;manualP=true}
  const tDays=Math.min(7,sessions),ratio=kcal/tdee;
  const restKcal=base*ratio,trainKcal=tDays?(base+weekly/tDays)*ratio:null;
  const bmi=w/Math.pow(b.height/100,2),tBmi=b.targetWeight?b.targetWeight/Math.pow(b.height/100,2):null;
  let weeks=null;if(b.targetWeight){const diff=b.targetWeight-w,delta=kcal-tdee;if(Math.abs(diff)>=0.3&&Math.sign(diff)===Math.sign(delta)&&Math.abs(delta)>=100)weeks=Math.ceil(Math.abs(diff)*7700/Math.abs(delta)/7)}
  const warn=[],tl=timeline(b,w);
  if(tl&&tl.level!=="ok")warn.push(tl.msg);
  if(b.targetWeight&&!tl){const diff=b.targetWeight-w;
    if(isBulk(goal)&&diff<-0.5)warn.push("Je doelgewicht ligt onder je huidige gewicht, maar je doel is een bulk. Kies afvallen of droogtrainen, of pas je doelgewicht aan.");
    if(isCut(goal)&&diff>0.5)warn.push("Je doelgewicht ligt boven je huidige gewicht, maar je doel is afvallen of droogtrainen. Kies een bulk of pas je doelgewicht aan.");}
  if(isCut(goal)&&bmi<18.5)warn.push("Je BMI ligt onder 18,5. Afvallen raden we dan niet aan. Overleg bij twijfel met een huisarts of diëtist.");
  if(tBmi&&tBmi<18.5)warn.push("Je doelgewicht geeft een BMI onder 18,5. Dat is ondergewicht; kies een hoger doel.");
  if(floored&&!manualK)warn.push("Het berekende tekort was te groot. Je dagdoel is afgerond naar een veilige ondergrens; reken dan op langzamer resultaat.");
  if(manualK&&kcal<floor)warn.push(`Je handmatige dagdoel ligt onder de veilige ondergrens van ± ${r10(floor)} kcal voor jou.`);
  if(carbShort&&!manualP)warn.push(`Met dit dagdoel haal je de ${carbFloor} g koolhydraten per kg niet die bij jouw hoeveelheid duursport past. Overweeg een kleiner tekort.`);
  return{bmr,base,wk,neatTxt,weekly,sessions,tdee,adj:kcal-tdee,adviceKcal,kcal,protein,pPerKg:protein/w,fat,carbs,restKcal,trainKcal,tDays,bmi,weeks,warn,w,b,ptype,endH,strH,carbFloor,manualK,manualP};
}

function foodAllowed(f,p){
  const d=p.diet||{},t=" "+(f.t||"")+" ";

  diner:[[["rijst","zilvervlies","mie"],["kipfilet","kipdij","garnalen","kipshoarma","vegaburger"],["wokmix","broccoli","paprika","sperzie"],["olijfolie"]],

const DAYSNACKS=[[0,1],[2,3],[0,4]];
function pickFood(cands,p,used,rot){
  const ok=cands.filter(id=>FOOD[id]&&foodAllowed(FOOD[id],p)&&!used.has(id));
  if(!ok.length)return null;
  const liked=ok.filter(id=>p.likes.includes(id)),pool=liked.length?liked:ok;
  return pool[rot%pool.length];
}
function buildDay(di,n,p,seed){
  const items=[],used=new Set();
  for(const [m] of MEALS){
    const tpls=m==="snack"?DAYSNACKS[di].map(i=>TPL.snack[i]):[TPL[m][di]];
    tpls.forEach((tpl,ti)=>{
      tpl.forEach((slot,si)=>{
        let id=pickFood(slot,p,used,di+seed+si+ti);
        if(!id&&si<2){const cat=FOOD[slot[0]].cat;id=pickFood(FOODS.filter(f=>f.cat===cat||(["vlees","vis","eivega"].includes(cat)&&["vlees","vis","eivega"].includes(f.cat))).map(f=>f.id),p,used,di+seed)}
        if(id){used.add(id);items.push({meal:m,id,g:FOOD[id].por})}
      });
    });
  }
  optimize(items,n);
  const FILL=[["banaan","rijstwafel","ontbijtkoek","rozijnen"],["granola","muesli","noten_mix","pindakaas","brood_vk"],["melk_hv","sojamelk","skyr","yoghurt_mager"]];
  for(let k=0;k<3&&sumM(items).k<n.kcal*0.96;k++){
    const id=pickFood(FILL[(k+di)%FILL.length],p,used,di+seed+k);if(!id)continue;
    used.add(id);items.push({meal:"snack",id,g:FOOD[id].por});optimize(items,n);
  }
  return items;
}
function optimize(items,n){
  const T=[n.protein,n.carbs,n.fat],W=[3,1.5,1.5],lam=0.012;
  const A=items.map(it=>{const f=FOOD[it.id];return[f.p/100,f.c/100,f.f/100]});
  const M=()=>{const s=[0,0,0];items.forEach((it,i)=>{for(let k=0;k<3;k++)s[k]+=A[i][k]*it.g});return s};
  for(let sweep=0;sweep<60;sweep++){
    for(let i=0;i<items.length;i++){
      const f=FOOD[items[i].id],m=M(),r=m.map((v,k)=>v-T[k]);
      let num_=lam*(items[i].g-f.por)/(f.por*f.por),den=lam/(f.por*f.por);
      for(let k=0;k<3;k++){num_+=W[k]*A[i][k]*r[k]/(T[k]*T[k]);den+=W[k]*A[i][k]*A[i][k]/(T[k]*T[k])}
      items[i].g=Math.min(f.max,Math.max(f.min,items[i].g-num_/den));
    }
  }
  items.forEach(it=>{const f=FOOD[it.id];it.g=Math.min(f.max,Math.max(f.min,Math.round(it.g/f.st)*f.st))});
}
function macrosOf(it){const f=it.food||FOOD[it.id]||{k:0,p:0,c:0,f:0};const q=it.g/100;return{k:f.k*q,p:f.p*q,c:f.c*q,f:f.f*q}}
function sumM(list){return list.reduce((s,it)=>{const m=it.k!=null&&!it.id?it:macrosOf(it);s.k+=m.k;s.p+=m.p;s.c+=m.c;s.f+=m.f;return s},{k:0,p:0,c:0,f:0})}
function portionTxt(it){const f=FOOD[it.id];if(f.u){const n=Math.round(it.g/f.u*2)/2;const w={ei:"ei",banaan:"banaan",appel:"appel",sinaasappel:"sinaasappel",mandarijn:"mandarijn",kiwi:"kiwi",wrap:"wrap",eiwitreep:"reep",brood_vk:"snee",brood_wit:"snee",knackebrood:"cracker",rijstwafel:"rijstwafel",ontbijtkoek:"plak"}[f.id]||"stuk";return `${it.g} g · ${String(n).replace(".",",")} ${w}${n>1&&w==="snee"?"ën":n>1&&w==="ei"?"eren":""}`}return `${it.g} g`}
let dayCache=null;
function exampleDays(n){
  const p=prefs(),key=JSON.stringify([r10(n.kcal),r5(n.protein),r5(n.carbs),r5(n.fat),p,UI.daySeed||0]);

}

/* GPX: alleen tijd, afstand, hartslag en snelste afstanden worden bewaard, niet de route zelf */
function parseGpx(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("geen geldig GPX-bestand");
  const pts=[...doc.getElementsByTagName("trkpt")].map(p=>{
    const t=p.getElementsByTagName("time")[0];let hr=null;
    for(const el of p.getElementsByTagName("*"))if(/(^|:)hr$/i.test(el.nodeName)){hr=parseFloat(el.textContent);break}
    return{lat:parseFloat(p.getAttribute("lat")),lon:parseFloat(p.getAttribute("lon")),t:t?Date.parse(t.textContent):NaN,hr};
  }).filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&isFinite(p.t));
  if(pts.length<2)throw new Error("geen route met tijden gevonden");
  const R=6371000,rad=x=>x*Math.PI/180;
  const cum=[0];
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;cum.push(cum[i-1]+2*R*Math.asin(Math.sqrt(h)))}
  const totalM=cum[cum.length-1],secs=(pts[pts.length-1].t-pts[0].t)/1000;
  const typeEl=doc.getElementsByTagName("type")[0],type=typeEl?typeEl.textContent.toLowerCase():"";
  const sport=/cycl|bik|ride|fiets|^1$/.test(type)?"Wielrennen":/run|loop|^9$/.test(type)?"Hardlopen":null;
  const hrs=pts.map(p=>p.hr).filter(x=>x>30&&x<240);
  const avgHr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null,maxHr=hrs.length?Math.round(Math.max(...hrs)):null;
  const best=dm=>{let j=0,bestS=Infinity;for(let i=1;i<pts.length;i++){if(cum[i]<dm)continue;while(j+1<i&&cum[i]-cum[j+1]>=dm)j++;const over=(cum[i]-cum[j])-dm,seg=cum[j+1]-cum[j]||1;const tStart=pts[j].t+Math.min(1,over/seg)*(pts[j+1].t-pts[j].t);const s=(pts[i].t-tStart)/1000;if(s>0&&s<bestS)bestS=s}return isFinite(bestS)?Math.round(bestS):null};
  const d=new Date(pts[0].t);
  return{date:isoOf(d),secs,km:totalM/1000,sport,avgHr,maxHr,best,name:(doc.getElementsByTagName("name")[0]||{}).textContent||""};
}
async function importGpx(file){
  try{
    const g=parseGpx(await file.text()),c=UI.cardio;
    if(g.secs<=0||g.km<0.2)throw new Error("te korte activiteit");
    if(g.sport&&g.sport!==c.sport)c.sport=g.sport;
    const ds=c.sport==="Wielrennen"?BIKE_D:RUN_D,efforts={};
    for(const d of ds)if(g.km>=d){const s=g.best(d*1000);if(s)efforts[String(d)]=s}
    const t=Math.round(g.secs);
    Object.assign(c,{date:g.date,h:String(Math.floor(t/3600)||""),m:String(Math.floor(t%3600/60)),s:String(t%60),km:String(Math.round(g.km*100)/100).replace(".",","),avgHr:g.avgHr?String(g.avgHr):c.avgHr,maxHr:g.maxHr?String(g.maxHr):c.maxHr,efforts,gpx:`${file.name.slice(0,40)} · ${fmt1(g.km)} km`});
    saveCardioDraft();render();
    const n=Object.keys(efforts).length;toast(`GPX ingelezen: ${fmt1(g.km)} km in ${durTxt(g.secs/60)}${n?` · ${n} snelste afstand${n>1?"en":""} berekend`:""}`);
  }catch(e){toast("Dit bestand kon niet gelezen worden: "+(e.message||"onbekende fout")+". Gebruik een GPX-export van één activiteit.")}
}
function cardioSessions(sport){return sortedSessions().filter(s=>s.kind==="cardio"&&(!sport||s.sport===sport))}
function cardioSummary(s){return [s.km?fmt1(s.km)+" km":null,durTxt(s.durMin),s.km&&s.durMin&&isRunBike(s.sport)?(s.sport==="Hardlopen"?paceTxt(s.durMin,s.km):fmt1(speed(s.durMin,s.km))+" km/u"):null].filter(Boolean).join(" · ")}
function distRecords(sport){
  const ds=sport==="Wielrennen"?BIKE_D:RUN_D,list=cardioSessions(sport),out=[];
  for(const d of ds){
    let best=null;
    for(const s of list){
      let sec=null,est=false;
      if(s.efforts&&s.efforts[String(d)])sec=s.efforts[String(d)];
      else if(s.km&&s.durMin&&s.km>=d-0.05){sec=s.durMin*60/s.km*d;est=Math.abs(s.km-d)>0.05}
      if(sec&&(!best||sec<best.sec))best={sec,est,date:s.date,id:s.id};
    }
    if(best)out.push({d,...best});
  }
  return out;
}

  }
  return h;
}

async function runJobs(jobs,fn){for(let i=0;i<jobs.length;i+=8)await Promise.all(jobs.slice(i,i+8).map(j=>fn(...j)))}
function cleanItem(it){return{name:String(it&&it.name||"").trim().slice(0,80),group:it&&it.group==="Benen"?legGroup(it.name):GROUPS.includes(it&&it.group)?it.group:"Overig",sets:String(it&&it.sets||"").slice(0,10),reps:String(it&&it.reps||"").slice(0,20),note:String(it&&it.note||"").slice(0,200)}}
async function addFolderSet(pkg,fid){
  const exMap=new Map(Object.entries(S.exercises).map(([id,x])=>[norm(x.name),id]));
  const ex=[],rest=[];
  const resolve=it=>{const k=norm(it.name);if(exMap.has(k))return exMap.get(k);const id=uid();exMap.set(k,id);ex.push(["exercises",id,{name:it.name,group:it.group}]);return id};
  if(fid)rest.push(["folders",fid,{name:String(pkg.name||"Map").slice(0,60),order:folderList().length,lib:pkg.lib||null}]);
  const base=fid?0:routinesIn(null).length;
  (pkg.routines||[]).forEach((r,i)=>{
    const items=(r.items||[]).map(cleanItem).filter(it=>it.name);
    rest.push(["routines",uid()+i,{name:String(r.name||"Schema").slice(0,80),folderId:fid||null,order:base+i,items:items.map(it=>({exId:resolve(it),sets:it.sets,reps:it.reps,note:it.note}))}]);
  });
  await runJobs(ex,put);await runJobs(rest,put);
  if(fid){UI.open["f:"+fid]=true;lsSet(LS_OPEN,UI.open)}
  return fid;
}
async function addLibrary(libId,fid){const lib=LIB.find(l=>l.id===libId);if(!lib)return null;return addFolderSet({name:lib.name,lib:libId,routines:lib.routines},fid||("fd-"+libId+"-"+uid()))}
async function seedStandard(){
  if(seeding||!pid||S.mode!=="cloud"||queue().length||(S.meta.seed&&S.meta.seed.v>=5))return;
  seeding=true;const id=pid;
  try{
    if(S.meta.seed&&S.meta.seed.v===4){
      const ent=Object.entries(S.routines).find(([,r])=>r.folderId==="fd-kt3"&&r.name==="Legs/abs");
      if(ent){
        const [rid,r]=ent,lib=LIB[0].routines[2].items,have=new Set((r.items||[]).map(it=>norm(exName(it.exId)))),add=[];
        const exMap=new Map(Object.entries(S.exercises).map(([xid,x])=>[norm(x.name),xid]));
        for(const it of lib.slice(6))if(!have.has(norm(it.name))){let xid=exMap.get(norm(it.name));if(!xid){xid=uid();await put("exercises",xid,{name:it.name,group:it.group})}add.push({exId:xid,sets:"",reps:"",note:""})}
        if(add.length)await put("routines",rid,{...clone(r),items:[...(r.items||[]),...add]});
      }
      await put("meta","seed",{v:5,at:Date.now()});render();return;
    }
    await runJobs(OLD_TPL_ROUTINES.filter(r=>S.routines[r]).map(r=>["routines",r]),del);
    const used=new Set();
    for(const s of Object.values(S.sessions))for(const e of s.entries||[]){used.add(e.exId);used.add(norm(e.name))}
    for(const r of Object.values(S.routines))for(const it of r.items||[])used.add(it.exId);
    await runJobs(Object.keys(TEMPLATE.exercises).filter(x=>S.exercises[x]&&!used.has(x)&&!used.has(norm(S.exercises[x].name))).map(x=>["exercises",x]),del);
    if(pid!==id)return;
    if(!folderList().some(f=>f.lib==="kt3"))await addLibrary("kt3","fd-kt3");
    await put("meta","seed",{v:5,at:Date.now()});
    render();
  }finally{seeding=false}
}

async function shareThing(kind,id){
  let pkg;
  if(kind==="folder"){const f=S.folders[id];if(!f)return;pkg={type:"folder",name:f.name,routines:routinesIn(id).map(([,r])=>pkgRoutine(r))}}
  else{const r=S.routines[id];if(!r)return;pkg={type:"routine",name:r.name,routines:[pkgRoutine(r)]}}
  if(!pkg.routines.some(r=>r.items.length)){toast("Er staan nog geen oefeningen in om te delen.");return}
  pkg.by=S.me?.name||"";pkg.v=1;
  try{const c=await rpc("kl_share_create",{p_code:code,p_profile:pid,p_pin:myPin(),p_data:pkg});UI.sheet={type:"share",code:c,name:pkg.name,kind,pkg};UI.confirm=null;render()}
  catch(e){if(e.code==="net")toast("Delen lukt alleen met internet.");else if(e.code==="too_big")toast("Dit is te groot om te delen. Deel de schema's los.");else handleErr(e)}

async function lookupShare(c){

  try{const d=await rpc("kl_share_get",{p_code:code,p_share:c});UI.sheet={type:"import",code:c,data:d};UI.confirm=null;render()}
  catch(e){if(e.code==="no_share")toast("Deze deelcode bestaat niet. Controleer de tekens.");else if(e.code==="net")toast("Geen verbinding. Probeer het opnieuw als je internet hebt.");else handleErr(e)}

/* ---------- planning ---------- */
function planList(){return Object.entries(S.plan||{}).map(([id,p])=>({id,...p}))}
function planKind(p){return p.type||"cardio"}
function planDoneFor(p){
  if(p.doneAt)return{kind:"check"};
  const s=planSession(S.sessions,p.id);if(s)return s;
  if(planKind(p)==="routine"&&p.routineId)return sortedSessions().find(x=>x.date===p.date&&x.routineId===p.routineId&&!x.planId)||null;
  return null;
}
function planTitle(p){const k=planKind(p);if(k==="routine")return S.routines[p.routineId]?.name||p.routineName||"Schema";if(k==="rest")return "Rustdag";return p.title||p.sport||"Training"}
function planChip(p){const k=planKind(p);return k==="routine"?"Kracht":k==="rest"?"Rust":k==="other"?"Overig":(p.sport||"Duur")}
function sessionSummary(s){if(!s)return "";if(s.kind==="check")return "Afgevinkt";if(s.kind==="cardio")return cardioSummary(s);const n=(s.entries||[]).reduce((t,e)=>t+(e.sets||[]).length,0);const e=(s.entries||[]).length;return `${e} oefening${e===1?"":"en"} · ${n} set${n===1?"":"s"}`}
function dayName(iso){const t=today();const w=new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"long"});const lbl=iso===t?"Vandaag":iso===addDays(t,1)?"Morgen":iso===addDays(t,-1)?"Gisteren":w.charAt(0).toUpperCase()+w.slice(1);return `${lbl} ${new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}`}
function weekStart(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d)}
function weekNo(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7)}
function planItemBtn(p,late){
  const k=planKind(p);
  if(k==="rest")return "";
  if(k==="routine")return `<button class="btn ${late?"":"primary"}" data-act="plan-start" data-id="${p.id}">Start training</button>`;
  if(k==="other")return `<button class="btn" data-act="pl-check" data-id="${p.id}">Afvinken als gedaan</button>`;
  return `<button class="btn ${late?"":"primary"}" data-act="plan-start" data-id="${p.id}">${late?"Toch nog loggen":"Training loggen"}</button>`;
}
function viewPlanCard(){
  const t=today(),to=addDays(t,14),from=addDays(t,-7);
  const all=planList();
  const show=all.filter(p=>{const done=planDoneFor(p);if(p.date===t)return true;if(!p.coach)return false;if(p.date>t&&p.date<=to)return true;return p.date<t&&p.date>=from&&!done})
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.updated||0)-(b.updated||0));
  if(!show.length)return "";
  return `<h2>Op je planning</h2><div class="stack">${show.map(p=>{
    const done=planDoneFor(p),late=!done&&p.date<t,k=planKind(p);

    return `<article class="card plan k-${k}${done?" done":""}${late?" late":""}"><div class="ph"><span class="pd">${esc(dayLabel(p.date))}</span><span class="chip">${esc(planChip(p))}</span></div>
      <strong class="pt">${esc(planTitle(p))}</strong>${tg?`<span class="muted small">${tg}</span>`:""}
      ${txt?`<p class="pdesc">${esc(txt)}</p>`:""}
      ${done?`<div class="pdone">✓ Gedaan: ${sessionSummary(done)}</div>`:planItemBtn(p,late)}
      ${p.coach?`<span class="small muted">Van ${esc(p.coach)}${late?" · nog niet gelogd":""}</span>`:""}</article>`}).join("")}</div><button class="linkbtn" data-act="go-plan">Hele week bekijken →</button>`;

function viewPlan(){
  const t=today(),ws=UI.week||weekStart(t),days=[...Array(7)].map((_,i)=>addDays(ws,i)),items=planList();
  let planned=0,done=0;
  const dayHtml=days.map(d=>{
    const its=items.filter(p=>p.date===d).sort((a,b)=>(a.updated||0)-(b.updated||0));

    const extra=sortedSessions().filter(s=>s.date===d&&!linked.has(s.id));
    its.forEach(p=>{if(planKind(p)!=="rest"){planned++;if(planDoneFor(p))done++}});
    return `<section class="day${d===t?" today":""}${d<t?" past":""}"><div class="dh"><span class="dn">${esc(dayName(d))}</span><button class="linkbtn" data-act="pl-add" data-id="${d}">+ Plannen</button></div>

    <div class="weeksum">${planned?`<b>${done} van ${planned}</b> geplande training${planned>1?"en":""} gedaan`:"Nog niets gepland deze week"}${ws!==weekStart(t)?` · <button class="linkbtn" data-act="wk-today">naar deze week</button>`:""}</div>
    <div class="days">${dayHtml}</div>

    <p class="small muted">Tik op een dag om een schema, duurtraining, rustdag of andere sport te plannen. Gedane trainingen krijgen vanzelf een vinkje.</p>`;

async function weekCopy(){

  if(!src.length){toast("Er staat deze week nog niets in je eigen planning om te kopiëren.");return}
  const key=p=>[p.date,planKind(p),p.routineId||"",p.title||"",p.sport||""].join("|");
  const have=new Set(items.map(key)),stem=uid(),jobs=[];

function checkResults(d){
  if(!d||d.type!=="results"||!Array.isArray(d.sessions)||!d.sessions.length)throw new Error("geen resultatenbestand");
  let n=0;for(const s of d.sessions){if(!Array.isArray(s.entries))throw new Error("training zonder oefeningen");for(const e of s.entries){if(!e.name||!Array.isArray(e.sets))throw new Error("oefening zonder naam of sets");n+=e.sets.length}}
  return n;
}
async function makeResultsCode(){
  let d;try{d=JSON.parse(document.getElementById("res-json")?.value||"");checkResults(d)}catch(e){toast("Dit is geen geldig resultatenbestand: "+e.message);return}
  d.by=S.me.name;
  try{const c=await rpc("kl_share_create",{p_code:code,p_profile:pid,p_pin:myPin(),p_data:d});UI.sheet={type:"share",code:c,name:d.name||"Resultaten",kind:"results"};render()}
  catch(e){if(e.code==="too_big")toast("Bestand is te groot. Splits het in delen.");else handleErr(e)}
}
async function importResults(d){
  const exMap=new Map(Object.entries(S.exercises).map(([id,x])=>[norm(x.name),id])),ex=[],ses=[];
  const resolve=(name,group)=>{const k=norm(name);if(exMap.has(k))return exMap.get(k);const id=uid();exMap.set(k,id);ex.push(["exercises",id,{name:String(name).slice(0,80),group:GROUPS.includes(group)?group:"Overig"}]);return id};
  d.sessions.forEach((s,i)=>{
    const date=/^\d{4}-\d{2}-\d{2}$/.test(s.date||"")?s.date:today();
    const entries=s.entries.map(e=>({exId:resolve(e.name,e.group),name:String(e.name),group:GROUPS.includes(e.group)?e.group:"Overig",sets:e.sets.map(x=>({k:+x.k||0,r:Math.round(+x.r||0)})).filter(x=>x.r>0)})).filter(e=>e.sets.length);
    if(entries.length)ses.push(["sessions",uid()+"i"+i,{date,ts:Date.parse(date+"T12:00:00")||Date.now(),routineId:null,routineName:String(s.name||"Geïmporteerde training").slice(0,80),entries,imported:true}]);
  });
  await runJobs(ex,put);await runJobs(ses,put);
  return ses.length;
}

}

function privacyHtml(){
  return `<h3>Privacyverklaring Krachtlogboek</h3><p class="small muted">Versie 1 · 19 oktober 2026</p>
  <h4>Wie biedt de app aan?</h4><p>Het Krachtlogboek wordt privé aangeboden door Jitse, vrijwillig, kosteloos en op vriendschappelijke basis. Er is geen bedrijf, geen lidmaatschap en je betaalt niets. Jitse is beheerder van de app en verantwoordelijk voor de gegevens die erin staan.</p>

  <h4>Wie ziet wat?</h4><ul><li>Je eigen gegevens zie alleen jij.</li><li>Jitse ziet als beheerder: de namen van de accounts, het aantal trainingen, wanneer iemand laatst actief was en ingestuurde meldingen.</li><li><b>Samen trainen:</b> geef je iemand toestemming, dan mag die persoon alleen wat jij aanvinkt: trainingen in je planning zetten, schema's of maaltijden sturen. Hij of zij ziet van jou alleen de trainingen die hij of zij zelf voor je inplande en of je die gedaan hebt, en alleen als jij dat aanvinkt ook het resultaat daarvan. Je kunt toestemming altijd intrekken. Dit geldt ook voor Jitse.</li><li>Als beheerder van de database kan Jitse technisch bij alle gegevens. Hij kijkt daar alleen in als dat nodig is, bijvoorbeeld om een probleem op te lossen of een back-up terug te zetten.</li><li>Andere gebruikers zien verder niets van jou, ook je naam niet, tenzij je met iemand samen traint. Deel je zelf een schema, dan staat je naam als afzender bij dat schema.</li></ul>
  <h4>Waar staan de gegevens?</h4><ul><li>In een online database bij Supabase.</li><li>De app zelf staat op GitHub Pages.</li><li>Eén keer per week wordt een back-up gemaakt in een afgeschermde, privé GitHub-omgeving waar alleen Jitse bij kan.</li><li>Op je eigen telefoon staat een kopie, zodat de app ook zonder internet werkt. Bij uitloggen wordt die gewist.</li><li>Zoek je in het dagboek in Open Food Facts, dan gaat je zoekterm naar Open Food Facts. Verder gaan er geen gegevens naar andere partijen; de lettertypes zitten in de app zelf.</li></ul>
  <h4>Hoe lang?</h4><ul><li>Trainingen, je voedingsdagboek en je planning worden 3 maanden in detail bewaard. Daarna worden ze samengevat: je records, aantallen en maandtotalen blijven, de details verdwijnen.</li><li>Je profiel, gewicht en schema's blijven tot je ze zelf aanpast of verwijdert.</li><li>Back-ups worden maximaal 3 maanden bewaard.</li><li>Toestemmingen voor Samen trainen blijven staan tot jij of de ander ze intrekt, of tot een van beiden het account verwijdert. Voorstellen verdwijnen zodra je ze toevoegt of weigert; trek je toestemming in, dan vervallen openstaande voorstellen.</li><li>Verwijder je je account, dan worden al je gegevens, meldingen, deelcodes en toestemmingen direct gewist. Uit de back-ups verdwijnen ze binnen 3 maanden.</li></ul>

  <h4>Gebruik op eigen risico</h4><p>Jitse biedt de app aan als vriendendienst, zonder lidmaatschap of betaling. Hij doet zijn best om je gegevens zorgvuldig te beveiligen en de app goed te laten werken, maar geeft geen garantie dat de app altijd beschikbaar is, foutloos werkt of dat gegevens nooit verloren gaan. Je gebruikt de app op eigen risico. Voedings- en trainingsadviezen zijn algemene richtlijnen en geen medisch advies; overleg bij twijfel of klachten met een huisarts, diëtist of fysiotherapeut.</p>

/* ---------- v6: gegevens ouder dan 3 maanden samenvatten ---------- */
const KEEP_DAYS=92;
let compacting=false;
const monthTxt=m=>new Date(m+"-15T12:00:00").toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
function runEfforts(s){const out={};if(!isRunBike(s.sport))return out;
  for(const d of (s.sport==="Wielrennen"?BIKE_D:RUN_D)){let sec=null,est=false;if(s.efforts&&s.efforts[String(d)])sec=s.efforts[String(d)];else if(s.km&&s.durMin&&s.km>=d-0.05){sec=s.durMin*60/s.km*d;est=Math.abs(s.km-d)>0.05}if(sec)out[String(d)]={sec:Math.round(sec),est}}
  return out}
async function compactOld(){
  if(compacting||!pid||S.mode!=="cloud"||queue().length)return;
  const cutoff=addDays(today(),-KEEP_DAYS),id=pid;
  const oldS=Object.entries(S.sessions).filter(([,s])=>s&&s.date&&s.date<cutoff);
  const oldF=Object.entries(S.foodlog).filter(([d])=>d<cutoff);
  const oldP=Object.entries(S.plan).filter(([,p])=>p&&p.date&&p.date<cutoff);
  if(!oldS.length&&!oldF.length&&!oldP.length)return;
  compacting=true;
  try{
    const arch={},get=m=>arch[m]||(arch[m]=clone(S.archive[m]||{month:m,n:0,str:{},cardio:{},food:{days:0,k:0,p:0,c:0,f:0},done:[]}));
    for(const [sid,s] of oldS){const a=get(s.date.slice(0,7));if(a.done.includes(sid))continue;a.done.push(sid);a.n++;
      if(s.kind==="cardio"){const c=a.cardio[s.sport]||(a.cardio[s.sport]={n:0,km:0,min:0,longest:null,eff:{}});c.n++;c.km+=s.km||0;c.min+=s.durMin||0;
        if(s.km&&(!c.longest||s.km>c.longest.km))c.longest={km:s.km,date:s.date};
        for(const [d,e] of Object.entries(runEfforts(s)))if(!c.eff[d]||e.sec<c.eff[d].sec)c.eff[d]={...e,date:s.date}}
      else for(const e of s.entries||[]){const k=entryKey(e),r=a.str[k]||(a.str[k]={name:exName(e.exId,e.name),group:exGroup(e.exId,e.group),best:null,date:null,sessions:0});r.sessions++;
        for(const st of e.sets||[])if(st.r>0&&better(st,r.best)){r.best={k:st.k,r:st.r};r.date=s.date}}}
    for(const [d,doc] of oldF){const a=get(d.slice(0,7)),key="f:"+d;if(a.done.includes(key))continue;a.done.push(key);const its=(doc&&doc.items)||[];if(!its.length)continue;const t=sumM(its);a.food.days++;a.food.k+=t.k;a.food.p+=t.p;a.food.c+=t.c;a.food.f+=t.f}
    if(pid!==id)return;
    await runJobs(Object.entries(arch).map(([m,a])=>["archive",m,a]),put);
    if(queue().length||pid!==id)return;
    await runJobs([...oldS.map(([k])=>["sessions",k]),...oldF.map(([k])=>["foodlog",k]),...oldP.map(([k])=>["plan",k])],del);
    render();
  }finally{compacting=false}
}
function archList(){return Object.values(S.archive||{}).filter(a=>a&&a.month).sort((a,b)=>b.month.localeCompare(a.month))}
function bestFor(exId){
  const k=exKey(exId);let best=null,date=null;
  for(const s of Object.values(S.sessions))for(const e of s.entries||[])if(entryKey(e)===k)for(const st of e.sets||[])if(st.r>0&&better(st,best)){best=st;date=s.date}
  for(const a of archList()){const r=a.str&&a.str[k];if(r&&r.best&&better(r.best,best)){best=r.best;date=r.date}}
  return best?{set:best,date}:null;
}
function lastFor(exId){
  const k=exKey(exId);
  for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)return{sets:e.sets,date:s.date,name:s.routineName}}
  for(const a of archList()){const r=a.str&&a.str[k];if(r&&r.best)return{sets:[r.best],date:r.date,name:"samenvatting"}}
  return null;
}
function historyFor(exId){
  const k=exKey(exId),out=[];
  for(const s of sortedSessions()){const e=(s.entries||[]).find(x=>entryKey(x)===k);if(e&&e.sets&&e.sets.length)out.push({date:s.date,name:s.routineName,sets:e.sets})}
  for(const a of archList()){const r=a.str&&a.str[k];if(r&&r.best)out.push({date:r.date,name:`Samenvatting ${monthTxt(a.month)} · ${r.sessions}× getraind · beste set`,sets:[r.best]})}
  return out;
}
function distRecords(sport){
  const ds=sport==="Wielrennen"?BIKE_D:RUN_D,list=cardioSessions(sport),out=[];
  for(const d of ds){
    let best=null;
    for(const s of list){const e=runEfforts(s)[String(d)];if(e&&(!best||e.sec<best.sec))best={...e,date:s.date,id:s.id}}
    for(const a of archList()){const e=a.cardio&&a.cardio[sport]&&a.cardio[sport].eff[String(d)];if(e&&(!best||e.sec<best.sec))best={...e,id:null}}
    if(best)out.push({d,...best});
  }
  return out;
}
function viewCardioRecords(){
  const all=cardioSessions(),arch=archList();
  const archN=sp=>arch.reduce((t,a)=>t+((a.cardio&&a.cardio[sp]&&a.cardio[sp].n)||0),0);
  const sports=new Set([...all.map(s=>s.sport),...arch.flatMap(a=>Object.keys(a.cardio||{}))]);
  if(!sports.size&&!arch.length)return "";
  const month=today().slice(0,7);let h="";
  for(const sp of ["Hardlopen","Wielrennen"]){
    if(!sports.has(sp))continue;
    const l=cardioSessions(sp),n=l.length+archN(sp);
    const kmMonth=l.filter(s=>(s.date||"").startsWith(month)).reduce((t,s)=>t+(s.km||0),0);
    const longest=Math.max(0,...l.map(s=>s.km||0),...arch.map(a=>(a.cardio&&a.cardio[sp]&&a.cardio[sp].longest&&a.cardio[sp].longest.km)||0));
    const recs=distRecords(sp);
    h+=`<h2>${sp}</h2><div class="recgroup"><div class="row" style="cursor:default"><span class="n">Deze maand</span><span class="b">${fmt1(kmMonth)} km</span><span class="l">${n} ${n===1?"training":"trainingen"} totaal · langste ${fmt1(longest)} km</span></div>`+
      recs.map(r=>`<${r.id?`button class="row" data-act="open-session" data-id="${r.id}"`:`div class="row" style="cursor:default"`}><span class="n">${distLbl(r.d)}</span><span class="b">${r.est?"≈ ":""}${durTxt(r.sec/60)}</span><span class="l">${sp==="Hardlopen"?paceTxt(r.sec/60,r.d):fmt1(r.d/(r.sec/3600))+" km/u"} · ${dateTxt(r.date)}${r.est?" · o.b.v. gemiddeld tempo":""}</span></${r.id?"button":"div"}>`).join("")+`</div>`;
  }
  if(sports.has("Hardlopen")||sports.has("Wielrennen"))h+=`<p class="small muted">≈ = berekend met het gemiddelde tempo van een langere training. Importeer een GPX-bestand voor je echte snelste tijd binnen een training.</p>`;
  const others=[...sports].filter(s=>!isRunBike(s)).sort();
  if(others.length){
    h+=`<h2>Overige sporten</h2><div class="recgroup">`+others.map(nm=>{const l=cardioSessions(nm),n=l.length+archN(nm),mins=l.filter(s=>(s.date||"").startsWith(month)).reduce((t,s)=>t+(s.durMin||0),0);
      return `<div class="row" style="cursor:default"><span class="n">${esc(nm)}</span><span class="b">${n}×</span><span class="l">${mins?`Deze maand ${Math.floor(mins/60)?Math.floor(mins/60)+" u ":""}${Math.round(mins%60)} min`:"Deze maand nog niet"}${l.length?` · laatst ${dateTxt(l[0].date)}`:""}</span></div>`}).join("")+`</div>`;
  }
  if(arch.length)h+=`<h2>Eerdere maanden</h2><div class="recgroup">${arch.slice(0,24).map(a=>{const c=Object.entries(a.cardio||{}).map(([s,x])=>`${esc(s)} ${x.n}×${x.km?` (${fmt1(x.km)} km)`:""}`).join(" · "),strN=a.n-Object.values(a.cardio||{}).reduce((t,x)=>t+x.n,0),fd=a.food&&a.food.days;
    return `<div class="row" style="cursor:default"><span class="n">${monthTxt(a.month)}</span><span class="b none">${a.n} training${a.n===1?"":"en"}</span><span class="l">${strN?`Kracht ${strN}×`:""}${strN&&c?" · ":""}${c}${fd?` · voeding gemiddeld ${nl(a.food.k/fd)} kcal (${fd} dagen)`:""}</span></div>`}).join("")}</div><p class="small muted">Details ouder dan 3 maanden worden samengevat. Je records blijven altijd bewaard.</p>`;
  return h;
}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  switch(b.dataset.act){
    case "consent-yes":await giveConsent();break;
    case "consent-no":UI.confirm="self-del";render();setTimeout(()=>document.getElementById("sd-pin")?.focus(),30);break;
    case "self-del":UI.confirm="self-del";render();setTimeout(()=>document.getElementById("sd-pin")?.focus(),30);break;
    case "self-del-yes":await selfDelete();break;
    case "go-privacy":UI.tab="privacy";lsSet(LS_TAB,"privacy");UI.sheet=null;render();window.scrollTo(0,0);break;
    case "login-privacy":UI.login="privacy";render();window.scrollTo(0,0);break;
  }
});

function mealsAll(){return [...Object.entries(S.meals||{}).map(([id,m])=>({...m,id:"u:"+id})),...MEAL_LIB]}
function mealById(id){return id&&id.startsWith("u:")?(S.meals[id.slice(2)]?{...S.meals[id.slice(2)],id}:null):MEAL_LIB.find(m=>m.id===id)||null}

function mealParts(m,mul){return (m.items||[]).map(it=>({f:partFood(it),fid:it.fid||null,g:it.g*(mul||1)})).filter(x=>x.f)}
function partsMacros(ps){return ps.reduce((s,x)=>{const q=x.g/100;s.k+=x.f.k*q;s.p+=x.f.p*q;s.c+=x.f.c*q;s.f+=x.f.f*q;return s},{k:0,p:0,c:0,f:0})}
function partsCost(ps){let use=0,pkg=0,unknown=0;for(const x of ps){const f=x.fid&&FOOD[x.fid];if(!f){unknown++;continue}const eur=priceOf(f);use+=x.g/1000*eur;pkg+=Math.max(1,Math.ceil(x.g/f.pkg-0.05))*f.pkg/1000*eur}return{use,pkg,unknown}}
const eur=n=>"€ "+n.toFixed(2).replace(".",",");
function mealAllowed(m){const p=prefs();return (m.items||[]).every(it=>{const f=it.fid&&FOOD[it.fid];return !f||foodAllowed(f,p)})}
function entryParts(e){if(e.t==="m"){const m=mealById(e.id);return m?mealParts(m,e.mul||1):[]}const f=anyFood(e.fid);return f?[{f,fid:e.fid,g:e.g}]:[]}
function entryName(e){if(e.t==="m"){const m=mealById(e.id);return m?m.n+((e.mul||1)!==1?` × ${String(e.mul).replace(".",",")}`:""):"(verwijderde maaltijd)"}const f=anyFood(e.fid);return f?f.n:"(onbekend product)"}

function shopState(){const k="krachtlogboek.shop2."+pid;if(!UI.shop2)UI.shop2=lsGet(k)||{src:null,off:{},have:{}};return UI.shop2}
function shopSave(){lsSet("krachtlogboek.shop2."+pid,UI.shop2)}
function shopSources(n){
  const out=Object.entries(S.mealplans||{}).map(([id,p])=>({key:"p:"+id,n:p.n||"Maaltijdplan",entries:p.entries||[]}));
  exampleDays(n).forEach((items,di)=>out.push({key:"ex:"+di,n:"Voorbeelddag "+"ABC"[di],entries:items.map(it=>({slot:it.meal,t:"p",fid:it.id,g:it.g}))}));
  return out;
}
function viewShop(n){
  const st=shopState(),srcs=shopSources(n);
  if(!st.src){st.src={};const mine=srcs.filter(s=>s.key.startsWith("p:"));if(mine.length)st.src[mine[0].key]=7;else{st.src["ex:0"]=3;st.src["ex:1"]=2;st.src["ex:2"]=2}}
  const units=[];
  for(const s of srcs){const days=st.src[s.key]||0;if(!days)continue;
    const grp={};for(const e of s.entries){if(e.t==="m"){units.push({key:s.key+"|m|"+e.id+"|"+e.slot,n:entryName(e),src:s.n,days,parts:entryParts(e)})}else(grp[e.slot]=grp[e.slot]||[]).push(e)}
    for(const [slot,es] of Object.entries(grp))units.push({key:s.key+"|s|"+slot,n:`${(MEALS.find(x=>x[0]===slot)||MEALS[0])[1]}`,src:s.n,days,parts:es.flatMap(entryParts)});
  }
  const prod={};let use=0;
  for(const u of units){if(st.off[u.key])continue;const c=partsCost(u.parts);use+=c.use*u.days;for(const x of u.parts){if(!x.fid||!FOOD[x.fid])continue;prod[x.fid]=(prod[x.fid]||0)+x.g*u.days}}

/* doelgewicht met termijn */
const GOAL_RATE={afvallen:-0.9,droog_heavy:-0.75,droog_lean:-0.4,onderhoud:0,bulk_lean:0.25,bulk_heavy:0.45};
function timeline(b,w){
  if(!b.targetWeight||!b.tdate||!w)return null;
  const days=(Date.parse(b.tdate+"T12:00:00")-Date.parse(today()+"T12:00:00"))/864e5;
  if(days<7)return{level:"warn",msg:"Kies een datum voor je doelgewicht die minstens een week vooruit ligt."};
  const diff=b.targetWeight-w,weeks=days/7,rate=diff/weeks,pct=rate/w*100,ap=Math.abs(pct),g=b.goal;
  const kg=x=>fmt1(Math.abs(x)),dt=dateTxt(b.tdate);
  const sug=r=>{const wk=Math.ceil(Math.abs(diff)/(w*Math.abs(r)/100));return dateTxt(addDays(today(),wk*7))};
  if(Math.abs(diff)<0.5)return{level:"ok",msg:`Je zit al vrijwel op je doelgewicht.`};
  const base=`Om op ${dt} ${fmt1(b.targetWeight)} kg te wegen, moet je ± ${kg(rate)} kg per week ${diff>0?"aankomen":"afvallen"} (${fmt1(ap)}% van je gewicht).`;
  if(diff>0){
    if(pct>0.55)return{level:"warn",msg:`${base} Dat is eerder een dirty bulk: je komt dan vooral vet aan in plaats van spieren. Een haalbare datum met een heavy bulk is rond ${sug(0.45)}, met een lean bulk rond ${sug(0.25)}.`};
    if(isCut(g)||g==="onderhoud")return{level:"warn",msg:`${base} Dat past bij een ${pct>0.3?"heavy":"lean"} bulk, niet bij je gekozen doel.`};
    if(g==="bulk_lean"&&pct>0.3)return{level:"warn",msg:`${base} Dat tempo past meer bij een heavy bulk dan bij een lean bulk. Wil je lean blijven, mik dan op rond ${sug(0.25)}.`};
    if(g==="bulk_heavy"&&pct<=0.3)return{level:"info",msg:`${base} Dat lukt ook rustiger met een lean bulk, met minder extra vet.`};
    return{level:"ok",msg:`${base} Dat past goed bij je doel.`};
  }
  if(ap>1)return{level:"warn",msg:`${base} Dat is sneller dan gezond: je verliest dan ook spiermassa en houdt het moeilijk vol. Kies een latere datum, bijvoorbeeld rond ${sug(0.75)}.`};
  if(isBulk(g)||g==="onderhoud")return{level:"warn",msg:`${base} Dat past bij ${ap>0.5?"heavy droogtrainen of afvallen":"lean droogtrainen"}, niet bij je gekozen doel.`};
  if(g==="droog_lean"&&ap>0.5)return{level:"warn",msg:`${base} Dat tempo past meer bij heavy droogtrainen of afvallen. Wil je rustig droogtrainen, mik dan op rond ${sug(0.4)}.`};
  if((g==="droog_heavy"||g==="afvallen")&&ap<=0.5)return{level:"info",msg:`${base} Dat lukt ook rustiger met lean droogtrainen; daarmee behoud je makkelijker je spieren.`};
  return{level:"ok",msg:`${base} Dat past goed bij je doel.`};
}
function tlineHint(){const f=pfDraft(),b={...bodyMeta(),targetWeight:num(f.targetWeight),tdate:f.tdate,goal:f.goal},t=timeline(b,currentWeight());return `<span class="hintline tl-${t?t.level:"none"}" id="tl-hint">${t?esc(t.msg):"Vul een datum in om te zien of je doel realistisch is."}</span>`}

/* ---------- v6+: spiergroepen, delen voeding, boodschappenlijst ---------- */
const BASE_GROUPS=["Borst","Rug","Schouders","Biceps","Triceps","Onderarmen","Core","Quadriceps","Hamstrings","Billen","Kuiten","Full body","Overig"];
function legGroup(name){return /deadlift|rdl|nordic|hamstring|leg ?curl|good ?morning|single leg rdl/i.test(name||"")?"Hamstrings":"Quadriceps"}
function applyGroups(){const custom=((S.meta.groups&&S.meta.groups.custom)||[]).filter(g=>g&&!BASE_GROUPS.includes(g));GROUPS.splice(0,GROUPS.length,...BASE_GROUPS.slice(0,-1),...custom,"Overig")}
let migratingG=false;
async function migrateGroups(){
  applyGroups();
  if(migratingG||!pid||S.mode!=="cloud"||queue().length||(S.meta.seed&&S.meta.seed.g))return;
  migratingG=true;
  try{
    const jobs=Object.entries(S.exercises).filter(([,x])=>x.group==="Benen").map(([id,x])=>["exercises",id,{...x,group:legGroup(x.name)}]);
    await runJobs(jobs,put);
    await put("meta","seed",{...(S.meta.seed||{}),g:1});
  }finally{migratingG=false}
}
function groupSelect(id,cur){const list=[...GROUPS];if(cur&&!list.includes(cur))list.splice(list.length-1,0,cur);return `<select id="${id}">${list.map(g=>`<option ${g===cur?"selected":""}>${esc(g)}</option>`).join("")}</select>`}
async function addGroup(name){
  name=String(name||"").trim().slice(0,30);if(!name){toast("Vul een naam in voor de spiergroep.");return null}
  name=name.charAt(0).toUpperCase()+name.slice(1);
  if(GROUPS.some(g=>norm(g)===norm(name))){toast("Deze spiergroep bestaat al.");return GROUPS.find(g=>norm(g)===norm(name))}
  const custom=[...((S.meta.groups&&S.meta.groups.custom)||[]),name];
  await put("meta","groups",{custom});applyGroups();toastOk(`Spiergroep "${name}" toegevoegd`);return name;
}

  for(const s of srcs){const days=st.src[s.key]||0;if(!days)continue;
    const grp={};for(const e of s.entries){if(e.t==="m")units.push({key:s.key+"|m|"+e.id+"|"+e.slot,n:entryName(e),src:s.n,days,parts:entryParts(e)});else(grp[e.slot]=grp[e.slot]||[]).push(e)}

  }
  const prod={};let use=0;
  for(const u of units){if(st.off[u.key])continue;const c=partsCost(u.parts);use+=c.use*u.days;for(const x of u.parts){if(!x.fid||!FOOD[x.fid])continue;prod[x.fid]=(prod[x.fid]||0)+x.g*u.days}}

async function addRoutinesTo(routines,fid){

  const resolve=it=>{const k=norm(it.name);if(exMap.has(k))return exMap.get(k);const id=uid();exMap.set(k,id);ex.push(["exercises",id,{name:it.name,group:it.group}]);return id};
  const have=routinesIn(fid);let base=have.length;
  (routines||[]).forEach((r,i)=>{const items=(r.items||[]).map(cleanItem).filter(it=>it.name);const ex0=have.find(([,x])=>norm(x.name)===norm(r.name||""));const id=ex0?ex0[0]:uid()+"r"+i;ids.push(id);

async function importInbox(it){
  const d=it.data||{},by=it.name;
  if(it.kind==="routine"||it.kind==="folder"){
    let fid;if(it.kind==="folder"){let nm=String(d.name||"Map");if(folderList().some(f=>norm(f.name)===norm(nm)))nm+=` (van ${by})`;fid="fd-"+uid();await put("folders",fid,{name:nm,order:folderList().length});UI.open["f:"+fid]=true;lsSet(LS_OPEN,UI.open)}
    else fid=await folderFrom(by);
    await addRoutinesTo(d.routines,fid);return `${KIND_TXT[it.kind].toLowerCase()} "${d.name}"`;
  }
  if(it.kind==="plan"){
    const p=d.plan||{},extra={};
    if(p.type==="routine"&&d.routine){const fid=await folderFrom(by);
      const ex=routinesIn(fid).map(([id,r])=>[id,r]).find(([,r])=>norm(r.name)===norm(d.routine.name));
      const rid=ex?ex[0]:(await addRoutinesTo([d.routine],fid))[0];Object.assign(extra,{routineId:rid,routineName:d.routine.name})}
    const stem=uid(),jobs=(d.dates||[]).map((dt,i)=>["plan",stem+"h"+i,{...p,...extra,date:dt,coach:by,fromLink:it.link,updated:Date.now()}]);
    await runJobs(jobs,put);return `${(p.type==="rest"?"rustdag":"training")} ${d.name?`"${d.name}" `:""}op ${dayName(d.dates[0]).toLowerCase()}${jobs.length>1?` (+${jobs.length-1})`:""}`;
  }
  if(it.kind==="meal"){await importMealPkg(d,by);return `maaltijd "${d.name}"`}
  if(it.kind==="product"){await ensureFood({...d,n:d.name||d.n});return `product "${d.name}"`}
  if(it.kind==="mealplan"){
    const entries=[],seen=new Map();
    for(const e of d.entries||[]){
      if(e.t==="m"&&e.meal){const k=norm(e.meal.name);let mid=seen.get(k);if(!mid){mid=await importMealPkg(e.meal,by);seen.set(k,mid)}entries.push({slot:e.slot,t:"m",id:mid,mul:e.mul||1})}
      else if(e.t==="p"&&e.food)entries.push({slot:e.slot,t:"p",fid:e.food.fid&&FOOD[e.food.fid]?e.food.fid:await ensureFood(e.food),g:e.g});
    }
    await put("mealplans",uid(),{n:`${String(d.name||"Maaltijdplan").slice(0,60)} (van ${by})`,entries,updated:Date.now()});return `maaltijdplan "${d.name}"`;
  }
  throw new Error("onbekend");
}

const ST={good:["Goed","st-good"],warn:["Let op","st-warn"],bad:["Bijsturen","st-bad"],none:["Te weinig gegevens","st-none"]};
const e1rm=s=>s.k>0?s.k*(1+s.r/30):s.r;
function daysBetween(a,b){return Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/864e5)}
function weightTrend(from,to){
  const l=weightList().filter(x=>x.date>=from&&x.date<=to);if(l.length<2)return null;
  const span=daysBetween(l[0].date,l[l.length-1].date);if(span<6)return null;
  const xs=l.map(x=>daysBetween(from,x.date)),ys=l.map(x=>x.kg),n=l.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}
  const perDay=sxx?sxy/sxx:0;return{perWeek:perDay*7,n,span,first:l[0],last:l[l.length-1],list:l};
}
function periodStats(days){
  const t=today(),from=addDays(t,-(days-1)),pFrom=addDays(from,-days),pTo=addDays(from,-1);
  const n=nutrition(),b=bodyMeta();
  const fdays=[];for(let i=0;i<days;i++){const d=addDays(from,i),its=logDay(d);if(its.length){const m=sumM(its);if(m.k>300)fdays.push({d,...m})}}
  const avg=k=>fdays.length?fdays.reduce((s,x)=>s+x[k],0)/fdays.length:null;
  const ses=sortedSessions().filter(s=>s.date>=from&&s.date<=t),prev=sortedSessions().filter(s=>s.date>=pFrom&&s.date<=pTo);
  const perWeekTarget=Object.values(b.sports||{}).reduce((s,x)=>s+(x.n||0),0);
  const plan=planList().filter(p=>p.date>=from&&p.date<=t&&planKind(p)!=="rest"),planDone=plan.filter(p=>planDoneFor(p)).length;
  const best=(list)=>{const m={};for(const s of list)for(const e of s.entries||[]){const k=entryKey(e);for(const x of e.sets||[]){if(!(x.r>0))continue;const v=e1rm(x);if(!m[k]||v>m[k].v)m[k]={v,name:exName(e.exId,e.name),set:x}}}return m};
  const bNow=best(ses),bPrev=best(prev);let up=0,same=0,down=0;const ups=[],downs=[];
  for(const [k,x] of Object.entries(bNow)){const p=bPrev[k];if(!p)continue;const d=(x.v-p.v)/p.v;if(d>0.015){up++;ups.push(x.name)}else if(d<-0.03){down++;downs.push(x.name)}else same++}
  const km=l=>l.filter(s=>s.kind==="cardio").reduce((s,x)=>s+(x.km||0),0),mins=l=>l.filter(s=>s.kind==="cardio").reduce((s,x)=>s+(x.durMin||0),0);
  const wt=weightTrend(addDays(t,-Math.max(days,14)+1),t);
  return{days,from,t,n,b,fdays,kcal:avg("k"),prot:avg("p"),carb:avg("c"),fat:avg("f"),ses,prev,str:ses.filter(s=>s.kind!=="cardio").length,cardio:ses.filter(s=>s.kind==="cardio").length,
    perWeekTarget,plan:plan.length,planDone,up,same,down,ups,downs,compared:up+same+down,km:km(ses),kmPrev:km(prev),min:mins(ses),wt,weighIns:weightList().filter(x=>x.date>=from).length};
}
function rateEval(g,pct){
  if(g==="onderhoud"){const a=Math.abs(pct);return a<=0.25?"good":a<=0.5?"warn":"bad"}
  const target=GOAL_RATE[g]||0;
  if(Math.sign(pct)!==Math.sign(target)||Math.abs(pct)<0.05)return Math.abs(pct)<0.1?"warn":"bad";
  const r=pct/target;return r>2?"bad":r>=0.5&&r<=1.6?"good":"warn";
}
function progressTiles(P){
  const n=P.n,g=P.b.goal,w=currentWeight(),tiles=[];
  if(P.wt&&w){const pct=P.wt.perWeek/w*100,st=g?rateEval(g,pct):"none";
    tiles.push({k:"gewicht",l:"Gewicht",v:Math.abs(P.wt.perWeek)<0.05?"± 0 kg/week":`${P.wt.perWeek>=0?"+":"−"}${fmt1(Math.abs(P.wt.perWeek))} kg/week`,sub:`${fmt1(P.wt.first.kg)} → ${fmt1(P.wt.last.kg)} kg`,st})}
  else tiles.push({k:"gewicht",l:"Gewicht",v:"—",sub:"Weeg je minstens 2× met een week ertussen",st:"none"});
  const minDays=Math.min(4,Math.ceil(P.days/2));
  if(P.fdays.length>=minDays&&!n.miss){const d=(P.kcal-n.kcal)/n.kcal,a=Math.abs(d);
    tiles.push({k:"kcal",l:"Calorieën",v:`${nl(r10(P.kcal))} kcal`,sub:`doel ${nl(r10(n.kcal))} · ${d>=0?"+":"−"}${Math.round(a*100)}%`,st:a<=0.07?"good":a<=0.15?"warn":"bad"});
    const pr=P.prot/n.protein;tiles.push({k:"eiwit",l:"Eiwit",v:`${Math.round(P.prot)} g`,sub:`doel ${r5(n.protein)} g · ${Math.round(pr*100)}%`,st:pr>=0.9?"good":pr>=0.75?"warn":"bad"})}
  else{tiles.push({k:"kcal",l:"Calorieën",v:"—",sub:`Log je eten minstens ${minDays} dagen`,st:"none"});tiles.push({k:"eiwit",l:"Eiwit",v:"—",sub:"Komt uit je voedingsdagboek",st:"none"})}
  const weeks=P.days/7,tot=P.str+P.cardio;
  if(P.perWeekTarget){const r=tot/(P.perWeekTarget*weeks);tiles.push({k:"train",l:"Trainingen",v:`${tot}×`,sub:`doel ${Math.round(P.perWeekTarget*weeks)}× (${P.perWeekTarget}× per week)`,st:r>=0.9?"good":r>=0.6?"warn":"bad"})}
  else if(P.plan){const r=P.planDone/P.plan;tiles.push({k:"train",l:"Trainingen",v:`${P.planDone} van ${P.plan}`,sub:"geplande trainingen gedaan",st:r>=0.9?"good":r>=0.6?"warn":"bad"})}
  else tiles.push({k:"train",l:"Trainingen",v:`${tot}×`,sub:"Vul je sportweek in bij Profiel voor een doel",st:tot?"good":"none"});
  if(P.compared){const st=P.down>P.up?"bad":P.up>0?"good":"warn";tiles.push({k:"kracht",l:"Kracht",v:`${P.up} ↑ · ${P.same} = · ${P.down} ↓`,sub:"oefeningen t.o.v. de periode ervoor",st})}
  else if(P.str)tiles.push({k:"kracht",l:"Kracht",v:"—",sub:"Doe oefeningen vaker om te vergelijken",st:"none"});
  if(P.cardio||P.kmPrev){const d=P.kmPrev?(P.km-P.kmPrev)/P.kmPrev:1;tiles.push({k:"duur",l:"Duursport",v:`${fmt1(P.km)} km`,sub:P.kmPrev?`${d>=0?"+":"−"}${Math.round(Math.abs(d)*100)}% t.o.v. de periode ervoor`:`${P.cardio}× deze periode`,st:d>=-0.1?"good":d>=-0.35?"warn":"bad"})}
  if(P.plan&&P.perWeekTarget){const r=P.planDone/P.plan;tiles.push({k:"plan",l:"Planning",v:`${P.planDone} van ${P.plan}`,sub:"geplande trainingen gedaan",st:r>=0.9?"good":r>=0.6?"warn":"bad"})}
  return tiles;
}
function progressInsights(P,tiles){
  const n=P.n,g=P.b.goal,T=Object.fromEntries(tiles.map(t=>[t.k,t])),w=currentWeight(),out=[];
  const logged=P.fdays.length,wt=P.wt,pct=wt&&w?wt.perWeek/w*100:null,kcalDiff=P.kcal!=null&&!n.miss?P.kcal-n.kcal:null;
  // werkelijk verbruik uit dagboek + gewicht
  if(wt&&logged>=Math.min(10,P.days-2)&&P.days>=14){const real=P.kcal-wt.perWeek/7*7700;
    if(Math.abs(real-n.tdee)>150)var tdeeIns=({st:"info",t:`Op basis van wat je eet en hoe je gewicht verandert, lijkt je werkelijke verbruik ± ${nl(r10(real))} kcal per dag. De app rekende met ${nl(r10(n.tdee))} kcal. ${real>n.tdee?"Je verbrandt dus meer dan verwacht.":"Je verbrandt dus minder dan verwacht."} Pas je dagdoel gerust aan bij Voeding → Zelf aanpassen: ± ${nl(r10(real+(n.kcal-n.tdee)))} kcal past dan bij je doel.`})}

        else out.push({st:"warn",t:"Je gewicht stijgt niet. Houd een paar weken je eten bij in het dagboek, dan ziet de app of je genoeg eet."})}

        else if(kcalDiff!=null)out.push({st:"warn",t:"Je eet volgens je dagboek op je doel, maar je gewicht daalt niet. Controleer of je alles registreert (ook olie, sauzen en drinken) of verlaag je dagdoel met 150 kcal."});

  else if(P.up)out.push({st:"good",t:`Je wordt sterker: vooruitgang bij ${P.ups.slice(0,3).join(", ")}${P.up>3?` en ${P.up-3} andere`:""}.${T.eiwit&&T.eiwit.st==="good"?" Je eiwit zit ook goed; dat helpt.":""}`});

function progressChart(P){

}
